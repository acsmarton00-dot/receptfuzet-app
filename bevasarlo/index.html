<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:0}[hidden]{display:none!important}img{max-width:100%}</style>
<!-- Bevásárló – bevásárlólista (a Receptfüzet testvér-alkalmazása; iOS / Android / Windows)
     A „@@BEILLESZT név” helyekre a build.py a Receptfüzet (src/app.html) azonos nevű közös részeit teszi. -->
<title>Bevásárló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2b5ea7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bevásárló">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
:root {
  --bg: #f4f7f3;
  --surface: #ffffff;
  --surface-2: #eaf0e9;
  --ink: #1b2820;
  --muted: #5a6a60;
  --line: #d6e0d6;
  --accent: #2e6b4a;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe1;
  --warm: #9a6a00;
  --warm-bg: #fbf0d4;
  --danger: #b3261e;
  --danger-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(20, 40, 28, .06), 0 4px 14px rgba(20, 40, 28, .06);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --radius: 14px;
  --tabbar-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #18201b; --surface-2: #202a24; --ink: #e5ece7; --muted: #98a89e;
    --line: #2a3530; --accent: #74c49b; --accent-ink: #0c1a12; --accent-soft: #1d3327;
    --warm: #e8b64e; --warm-bg: #33291a; --danger: #f0867c; --danger-soft: #3a1f1d;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201b; --surface-2: #202a24; --ink: #e5ece7; --muted: #98a89e;
  --line: #2a3530; --accent: #74c49b; --accent-ink: #0c1a12; --accent-soft: #1d3327;
  --warm: #e8b64e; --warm-bg: #33291a; --danger: #f0867c; --danger-soft: #3a1f1d;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  /* a ragadós fejléc így már a helyén áll (top: safe-area), nem csúszik rá a tartalomra */
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 60px; }
header.top h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
main .wrap { padding-block: 16px; display: flex; flex-direction: column; gap: 16px; }

/* Lapfülek */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .row { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
nav.tabs button {
  border: 0; background: none; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: .7rem; font-weight: 700; letter-spacing: .01em; padding: 0 2px; white-space: nowrap;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button.add span.plus { background: var(--accent); color: var(--accent-ink); border-radius: 10px; width: 40px; height: 24px; display: grid; place-items: center; }
nav.tabs button.add[aria-current="page"] span.plus { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Általános elemek */
.search { position: relative; }
.search input { width: 100%; padding: 12px 14px 12px 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
/* Egérrel (Windows) látsszon, hogy a sor oldalra görgethető */
@media (hover: hover) and (pointer: fine) {
  .chips { scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding-bottom: 6px; }
}
.chips.dragging { cursor: grabbing; user-select: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%;
}
.card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.thumb { width: 64px; height: 64px; border-radius: 10px; flex: none; background: var(--surface-2); object-fit: cover; display: grid; place-items: center; color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.card .t { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; }
.card .meta { color: var(--muted); font-size: .86rem; display: flex; gap: 10px; flex-wrap: wrap; }
.card .sub { color: var(--muted); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav { color: var(--warm); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 700; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.near { background: var(--warm-bg); color: var(--warm); }
.pill.demo { background: var(--surface-2); color: var(--muted); font-weight: 400; }
.missing { font-size: .86rem; color: var(--warm); }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.small { padding: 6px 12px; font-size: .9rem; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.section h2 { font-size: 1.15rem; }
.hint { color: var(--muted); font-size: .9rem; margin: 0; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

/* Űrlap */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field input, .field textarea, .field select, .ing-row input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; outline: none; min-width: 0;
}
.field input:focus, .field textarea:focus, .ing-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 .field:first-child { grid-column: 1 / -1; } }
.ing-rows { display: flex; flex-direction: column; gap: 8px; }
.ing-row { display: grid; grid-template-columns: 64px 76px 1fr auto auto; gap: 6px; align-items: center; }
.ing-row input { padding: 9px 8px; }
.ing-row label.opt { font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer; }
.iconbtn { border: 0; background: transparent; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--surface-2); }
.photo-prev { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; }

/* Recept nézet */
.hero-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius); }
.detail-head { display: flex; flex-direction: column; gap: 8px; }
.detail-head h2 { font-size: 1.9rem; letter-spacing: -.015em; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .9rem; }
.fact b { font-variant-numeric: tabular-nums; }
.scaler { display: inline-flex; align-items: center; gap: 4px; }
.scaler button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 700; }
.ings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ings li { display: grid; grid-template-columns: 18px 92px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
.ings li:last-child { border-bottom: 0; }
.ings .q { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); align-self: center; }
.dot.have { background: var(--accent); border-color: var(--accent); }
.ings .opt { color: var(--muted); font-size: .85rem; }
.steps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; max-width: 65ch; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: .9rem; }
.notes { white-space: pre-wrap; max-width: 65ch; margin: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* Kamra */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pantry-add { display: flex; gap: 8px; }
.pantry-add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 14px 8px 10px; cursor: pointer; user-select: none; min-width: 0; max-width: 100%;
}
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.check span.n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check span.c { margin-left: 2px; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.letter { flex-basis: 100%; font-family: var(--font-display); font-weight: 700; color: var(--muted); margin-top: 6px; }
.summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Importálás */
pre.sample { background: var(--surface-2); border-radius: 10px; padding: 12px; margin: 0; font-size: .85rem; overflow-x: auto; white-space: pre; line-height: 1.45; }
.preview-list { margin: 0; padding-left: 20px; }

/* Visszajelzés */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px); z-index: 20;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-weight: 700; max-width: calc(100% - 32px);
  box-shadow: var(--shadow);
}
@media (prefers-reduced-motion: no-preference) {
  .view-enter { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<style>
nav.tabs button { position: relative; gap: 3px; }
nav.tabs button .ic { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .15s; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"] .ic { background: var(--accent); color: var(--accent-ink); }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
nav.tabs button.add .ic { background: var(--accent-soft); color: var(--accent); }
nav.tabs button.add[aria-current="page"] .ic { background: var(--accent); color: var(--accent-ink); }
.tabbadge { position: absolute; top: 3px; left: calc(50% + 10px); background: var(--warm); color: var(--surface); border-radius: 999px; font-size: .66rem; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.chip.add { border-style: dashed; color: var(--muted); }
.catpick { display: flex; flex-wrap: wrap; gap: 8px; }
.inline-add { display: flex; gap: 8px; }
.inline-add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
input[list]::-webkit-calendar-picker-indicator { display: none !important; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.unitadd { display: grid; grid-template-columns: minmax(0, 1fr) auto 72px 86px auto; gap: 6px; align-items: center; }
.unitadd input, .unitadd select, .unitrow input, .unitrow select { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px; }
.unitadd .eq, .unitrow .eq { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.unitrow { display: grid; grid-template-columns: minmax(56px, 1fr) auto 64px 70px auto auto; gap: 6px; align-items: center; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); }
.unitrow:first-child { border-top: 0; }
.unitrow .c { color: var(--muted); font-size: .76rem; white-space: nowrap; }
@media (max-width: 520px) {
  .unitadd { grid-template-columns: auto 1fr 1fr; } .unitadd > input:first-child { grid-column: 1 / -1; } .unitadd > button { grid-column: 1 / -1; }
  .unitrow { grid-template-columns: minmax(0, 1fr) 58px 64px auto; } .unitrow .eq, .unitrow .c { display: none; }
}
/* Alapvető élelmiszerek (Beállítások) és a Bevásárlóba felírt tételek jelzése */
.stapleadd { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px 66px auto; gap: 6px; align-items: center; }
.stapleadd input, .staplerow input { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px; }
.staplerow, .staplehead { display: grid; grid-template-columns: minmax(0, 1fr) 54px 54px 58px 36px; gap: 6px; align-items: center; padding: 6px 4px 6px 12px; border-top: 1px solid var(--line); }
.staplerow:first-child { border-top: 0; }
.staplehead { border-top: 0; padding-top: 0; padding-bottom: 0; color: var(--muted); font-size: .72rem; }
.staplerow .nm, .staplehead span:first-child { min-width: 0; }
.staplerow .nm b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.staplerow .nm small { display: block; color: var(--muted); font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staplerow .nm small.low { color: var(--danger); }
@media (max-width: 520px) { .stapleadd { grid-template-columns: 1fr 1fr 1fr; } .stapleadd > input:first-child, .stapleadd > button { grid-column: 1 / -1; } }
.sentlist { list-style: none; margin: 0; padding: 0; }
.sentlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 4px 0 4px 2px; border-top: 1px solid var(--line); }
.sentlist li:first-child { border-top: 0; }
.sentlist li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sentlist li b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.toolbar .grow { flex: 1; min-width: 0; }
.syncbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); cursor: pointer; flex: none; }
.syncbtn.err { color: var(--danger); border-color: var(--danger); }
.syncbtn.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Sorok: kamra és bevásárlás */
.rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row-letter { padding: 5px 14px; background: var(--surface-2); font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: .82rem; }
.irow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border-top: 1px solid var(--line); min-height: 54px; }
.row-letter + .irow, .rows > .irow:first-child, .rows > .ibox:first-child .irow { border-top: 0; }
.irow .nm { min-width: 0; }
.irow .nm b { font-weight: 400; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .nm small { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow .qt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.irow .qt.none { font-weight: 400; color: var(--muted); font-size: .85rem; }
.acts { display: flex; gap: 2px; }
.iconbtn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
.ibox.open { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.iform { display: grid; grid-template-columns: minmax(0, 1fr) 84px 76px; gap: 6px; padding: 0 12px 12px; }
.iform .full { grid-column: 1 / -1; }
.iform input { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; }
.iform input:focus, .addform input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.iform .lbl { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }
.addform { display: grid; grid-template-columns: minmax(0, 1fr) 90px 80px auto; gap: 6px; }
.addform input { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; }
@media (max-width: 520px) {

<script>
"use strict";
/* ============================================================
   Tárolás – IndexedDB (a készüléken, saját „bevasarlo” adatbázis), tartalék: memória
   ============================================================ */
const Store = (() => {
  let db = null, mem = new Map(), ok = false;
  function open() {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open("bevasarlo", 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv"); };
        req.onsuccess = () => { db = req.result; ok = true; resolve(true); };
        req.onerror = () => resolve(false);
        req.onblocked = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  }
  function tx(mode, fn) {
    return new Promise((resolve, reject) => {
      const t = db.transaction("kv", mode); const r = fn(t.objectStore("kv"));
      t.oncomplete = () => resolve(r && "result" in r ? r.result : undefined);
      t.onerror = () => reject(t.error);
    });
  }
  return {
    open,
    get persistent() { return ok; },
    async get(k) { return ok ? tx("readonly", s => s.get(k)) : mem.get(k); },
    async set(k, v) { if (ok) await tx("readwrite", s => s.put(v, k)); else mem.set(k, v); }
  };
})();

/* ============================================================
   Közös segédfüggvények (a Receptfüzetből)
   ============================================================ */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const collator = new Intl.Collator("hu", { sensitivity: "base", numeric: true });
const sortHu = arr => arr.sort(collator.compare);
const UNITS = ["g","dkg","kg","mg","ml","cl","dl","l","db","ek","kk","tk","mk","evőkanál","teáskanál","kávéskanál","mokkáskanál","csipet","csomag","cs","gerezd","fej","szál","szelet","marék","bögre","csésze","pohár","üveg","doboz","konzerv","tasak","rúd","levél","ág","csokor","darab","kiskanál","nagykanál","késhegynyi","liter","gramm","deka","kiló"];
const UNITSET = new Set(UNITS.map(norm));
const isUnit = w => { const n = norm(w).replace(/\.$/, ""); return UNITSET.has(n) || S.units.some(u => norm(u.name) === n); };
/* Alapegységek (nem törölhetők) és az alapértelmezett, bővíthető egységek */
const BASE_UNITS = ["g", "dkg", "kg", "ml", "cl", "dl", "l", "db"];
const DEFAULT_UNITS = [
  { name: "ek", base: "ml", factor: 15 }, { name: "tk", base: "ml", factor: 5 }, { name: "kk", base: "ml", factor: 2.5 },
  { name: "bögre", base: "ml", factor: 250 }, { name: "csipet" }, { name: "csomag" }, { name: "gerezd" }, { name: "fej" },
  { name: "szál" }, { name: "szelet" }, { name: "doboz" }, { name: "üveg" }, { name: "marék" }
];
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i += 7) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + s.length.toString(36); }

function parseNum(s) {
  if (s == null || s === "") return null;
  if (typeof s === "number") return isFinite(s) ? s : null;
  s = String(s).trim().replace(",", ".");
  const map = { "½": .5, "¼": .25, "¾": .75, "fél": .5, "fel": .5 };
  if (s in map) return map[s];
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/); if (m) return m[1] / m[2];
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  return null;
}
const firstNum = q => parseNum(String(q ?? "").split(/\s*[-–]\s*/)[0]);
function fmtNum(n) {
  if (n == null || isNaN(n)) return "";
  const r = Math.round(n * 100) / 100;
  if (Math.abs(r - .5) < 1e-9) return "fél";
  return String(r).replace(".", ",");
}
const numStr = n => n == null ? "" : String(Math.round(n * 100) / 100).replace(".", ",");
function scaleQty(qty, f) {
  if (!qty || f === 1) return qty || "";
  const range = String(qty).match(/^\s*([\d.,/]+)\s*[-–]\s*([\d.,/]+)\s*$/);
  if (range) { const a = parseNum(range[1]), b = parseNum(range[2]); if (a != null && b != null) return fmtNum(a * f) + "–" + fmtNum(b * f); }
  const n = parseNum(qty);
  return n == null ? qty : fmtNum(n * f);
}
const UNIT_ALIAS = { evokanal: "ek", "evo kanal": "ek", nagykanal: "ek", teaskanal: "tk", kiskanal: "tk", kavekanal: "kk", kaveskanal: "kk", darab: "db", liter: "l", gramm: "g", deka: "dkg", dekagramm: "dkg", kilo: "kg", kilogramm: "kg", milliliter: "ml", deciliter: "dl", cs: "csomag" };
const UNIT_INFO = { mg: ["tomeg", .001], g: ["tomeg", 1], dkg: ["tomeg", 10], kg: ["tomeg", 1000], ml: ["terfogat", 1], cl: ["terfogat", 10], dl: ["terfogat", 100], l: ["terfogat", 1000], db: ["darab", 1] };
function canonUnit(u) { let n = norm(u).replace(/\.$/, ""); n = UNIT_ALIAS[n] || n; return n || "db"; }
function unitInfo(u) {
  const c = canonUnit(u);
  if (UNIT_INFO[c]) return { dim: UNIT_INFO[c][0], f: UNIT_INFO[c][1] };
  const cu = S.units.find(x => canonUnit(x.name) === c);
  if (cu && cu.base && cu.factor && UNIT_INFO[cu.base]) return { dim: UNIT_INFO[cu.base][0], f: cu.factor * UNIT_INFO[cu.base][1] };
  return { dim: c, f: 1 };
}
function fillUnits() { $("#dl-unit").innerHTML = [...BASE_UNITS, ...S.units.map(u => u.name)].map(u => `<option value="${esc(u)}">`).join(""); }
function convert(q, from, to) { const a = unitInfo(from), b = unitInfo(to); return a.dim === b.dim ? q * a.f / b.f : null; }
function amountText(q, u) { return [fmtNum(q), u].filter(Boolean).join(" "); }

function parseIngredient(line) {
  let s = String(line).replace(/^\s*([-*•–·]|\d+[.)]\s)\s*/, "").trim();
  if (!s) return null;
  let optional = false;
  const optRe = /\s*[\(\[]?\s*(opcion[aá]lis|elhagyhat[oó]|ha van|tetsz[eé]s szerint)\s*[\)\]]?\s*/i;
  if (optRe.test(s)) { optional = true; s = s.replace(optRe, " ").trim(); }
  s = s.replace(/[,;]?\s*[\(]?(ízlés szerint|izles szerint|igény szerint)[\)]?/i, "").trim();
  let qty = "", unit = "";
  const qm = s.match(/^((?:\d+\s+\d+\/\d+)|(?:\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?)|(?:\d+\/\d+)|½|¼|¾|fél)(?=\s|[a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]|$)\s*/i);
  if (qm) { qty = qm[1].replace(/\s+/g, "").replace("–", "-"); s = s.slice(qm[0].length); }
  const um = s.match(/^([^\s]+)\s+(.+)$/);
  if (um && isUnit(um[1])) { unit = um[1].replace(/\.$/, ""); s = um[2]; }
  s = s.replace(/^[:\-–\s]+/, "").replace(/\s+/g, " ").trim();
  if (!s) return null;
  return { qty, unit, name: s, optional };
}
const DONE_MARK = /^(☑|✓|✔|✅|\[x\]|\(x\))\s*/i;
const TODO_MARK = /^(☐|□|▢|⬜|\[ \]|\[\]|\( \)|[-*•·–]|\d+[.)])\s*/;
/* Visszaadja: { name, items, kind: "lista"|"kamra"|"", fromReceptfuzet } – a „Receptfüzet lista/kamra:” fejlécet is felismeri */
function parseListText(text) {
  const lines = String(text).replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => l.replace(/^\[\d{1,2}:\d{2}.*?\]\s*[^:]{1,40}:\s*/, ""));     // csevegőalkalmazás időbélyege, feladó
  let name = "", start = 0, kind = "", fromReceptfuzet = false;
  if (lines.length) {
    const m = lines[0].match(/^(?:🛒\s*)?(?:receptfüzet\s+|bevásárló\s+)?(?:bevásárló)?(lista|kamra)\s*[:\-–]\s*(.+)$/i);
    const marked = l => DONE_MARK.test(l) || TODO_MARK.test(l);
    if (m) { kind = m[1].toLowerCase(); name = m[2].trim(); start = 1; fromReceptfuzet = /^(?:🛒\s*)?receptfüzet/i.test(lines[0]); }
    else if (lines.length > 1 && !marked(lines[0]) && lines.slice(1).some(marked) && !/\d/.test(lines[0])) { name = lines[0].replace(/[:.]\s*$/, ""); start = 1; }
  }
  if (/^bevásárlólista$/i.test(name)) name = "";
  const items = [];
  for (let line of lines.slice(start)) {
    let done = false;
    for (let k = 0; k < 2; k++) {
      if (DONE_MARK.test(line)) { done = true; line = line.replace(DONE_MARK, ""); }
      else line = line.replace(TODO_MARK, "");
    }

/* Tétel áthelyezése másik bolt listájára (vagy a Gyűjtőlistára); a kiürült bolti lista megszűnik */
function moveItem(from, it, name) {
  const to = storeList(name); if (to === from) return null;
  removeItem(from, it);
  addItem(to, { name: it.name, qty: it.qty, unit: it.unit, dept: it.dept, pantry: it.pantry, src: it.src, note: it.note, done: it.done, staple: !!it.staple });
  to.updated = now();
  if (from.status === "closed" && !from.items.length) { S.lists = S.lists.filter(x => x !== from); S.listDel[from.id] = now(); }
  return to;
}
function bindItemRow(row, L, it, rerender) {
  const mv = $("[data-move]", row);
  if (mv) mv.onchange = async () => {
    if (!moveItem(L, it, mv.value)) return;
    await save.lists(); await save.products(); rerender(); toast(`${it.name} → ${mv.value || "bolt nélkül"}`);
  };
  const hb = $("[data-home]", row);
  if (hb) hb.onclick = async () => { it.pantry = !it.pantry; it.updated = now(); learnProduct(it.name, { pantry: it.pantry }); await save.lists(); await save.products(); rerender(); };
  const ed = $("[data-iedit]", row); if (ed) ed.onclick = () => { S.editItem = S.editItem === it.id ? null : it.id; rerender(); };
  const rm = $("[data-irm]", row); if (rm) rm.onclick = async () => { removeItem(L, it); await save.lists(); rerender(); };
  const sv = $("[data-isave]", row);
  if (sv) {
    const doSave = async () => {
      const name = $("[data-n]", row).value.trim() || it.name, dept = $("[data-d]", row).value, pantry = $("[data-p]", row).checked;
      it.name = name; it.qty = parseNum($("[data-q]", row).value); it.unit = $("[data-u]", row).value.trim(); it.dept = dept; it.pantry = pantry; it.updated = now();
      learnProduct(name, { dept, unit: it.unit || undefined, pantry });
      moveItem(L, it, $("[data-s]", row).value);
      S.editItem = null; await save.lists(); await save.products(); rerender(); toast("Mentve");
    };
    sv.onclick = doSave;
    $$("input", row).forEach(x => x.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doSave(); } }));
    $("[data-icancel]", row).onclick = () => { S.editItem = null; rerender(); };

}

function closedRow(i) {

function closedCard(l) {

/* A kamratételek szövegként (ha nincs Google-kapcsolat): a Receptfüzet Kamra fülén importálható */
function pantryText(listName, items) {
  return "Receptfüzet kamra: " + listName + "\n" + items.map(s => "☑ " + [s.name, s.qty != null ? amountText(s.qty, s.unit).replace(/^fél /, "0,5 ") : ""].filter(Boolean).join(" – ")).join("\n");
}
function bindClosed(l) {
  const card = $(`[data-list="${CSS.escape(l.id)}"]`, V);
  $("[data-toggle]", card).onclick = () => { toggleOpen("shut", l.id); renderLists(); };
  if (!isOpen(l.id)) return;
  $$(".ibox", card).forEach(row => {
    const it = l.items.find(s => s.id === row.dataset.id); if (!it) return;
    $("[data-done]", row).addEventListener("change", async e => { it.done = e.target.checked; it.updated = now(); await save.lists(); renderLists(); });
    bindItemRow(row, l, it, renderLists);
  });
  const dt = $("[data-donetoggle]", card); if (dt) dt.onclick = () => { toggleOpen("openDone", l.id); renderLists(); };
  const addIn = $("[data-addname]", card);
  const addIt = async () => { const v = addIn.value.trim(); if (!v) return; addItem(l, { name: v }); l.updated = now(); await save.lists(); await save.products(); renderLists(); };
  $("[data-additem]", card).onclick = addIt;
  addIn.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addIt(); } });
  const fin = $("[data-finish]", card);
  if (fin) fin.onclick = async () => {
    if (l.items.some(i => !i.done)) return;   // lezárni csak akkor lehet, ha minden tételt kihúztak vagy töröltek
    const done = l.items.filter(i => i.done), toPantry = done.filter(i => i.pantry);
    let msg = `${done.length} tétel megvéve`;
    if (toPantry.length) {
      const items = toPantry.map(i => ({ name: i.name, qty: i.qty ?? null, unit: i.unit || "" }));
      if (S.sync.url && S.sync.ver !== 1) {
        Handoff.queue("pantry", { listName: l.name, items });
        msg += ` · ${toPantry.length} megy a Receptfüzet kamrájába`;
      } else {
        const text = pantryText(l.name, items);
        try { await navigator.clipboard.writeText(text); msg += " · a kamratételek a vágólapon (Receptfüzet → Kamra → Importálás szövegből)"; }
        catch (e) { S.exportShow = { text, pantry: true }; }
      }
    }
    done.forEach(i => removeItem(l, i));
    S.lists = S.lists.filter(x => x !== l); S.listDel[l.id] = now();
    await save.lists(); renderLists(); toast(done.length ? msg + " · a lista lezárva" : "A lista lezárva");
    if (toPantry.length && S.sync.url) Sync.run().then(() => { if (S.view === "lists" && !isEditing()) renderLists(); });
  };
  $("[data-share]", card).onclick = () => exportList(l);
  $("[data-rename]", card).onclick = () => { S.renaming = S.renaming === l.id ? null : l.id; renderLists(); };
  if (S.renaming === l.id) {
    const box = $("[data-renbox]", card);
    bindStoreChips(box, async name => { if (name && name !== l.name) { l.name = name; l.updated = now(); uniteStoreLists(); await save.lists(); } S.renaming = null; renderLists(); });
    $("[data-renno]", box).onclick = () => { S.renaming = null; renderLists(); };
  }
  const del = $("[data-del]", card); if (del) del.onclick = () => { S.delList = l.id; renderLists(); };
  const dy = $("[data-delyes]", card); if (dy) dy.onclick = async () => { S.lists = S.lists.filter(x => x !== l); S.listDel[l.id] = now(); S.delList = null; await save.lists(); renderLists(); toast("Lista törölve"); };
  const dn = $("[data-delno]", card); if (dn) dn.onclick = () => { S.delList = null; renderLists(); };
}
/* Lista exportálása / importálása szövegként – ugyanaz a formátum, mint a Receptfüzetben */
function listText(l) {
  const items = [...l.items.filter(i => !i.done), ...l.items.filter(i => i.done)];
  return "Bevásárló lista: " + l.name + "\n" + items.map(s => (s.done ? "☑ " : "☐ ") + [s.name, s.qty != null ? amountText(s.qty, s.unit).replace(/^fél /, "0,5 ") : ""].filter(Boolean).join(" – ")).join("\n");
}
async function exportList(l) {
  const text = listText(l);
  try { await navigator.clipboard.writeText(text); toast("A lista a vágólapon – illeszd be az üzenetbe"); }
  catch (e) { S.exportShow = { text }; renderLists(); }
}
function importBox() {
  const im = S.importList, ex = S.exportShow;
  if (ex) return `<div class="section"><h2>${ex.pantry ? "Kamratételek a Receptfüzetnek" : "Lista szövege"}</h2><p class="hint">${ex.pantry ? "Nincs Google-kapcsolat, ezért szövegként adom át: másold ki, és a Receptfüzetben: Kamra → Importálás szövegből." : "Nem sikerült automatikusan a vágólapra tenni. Jelöld ki és másold ki:"}</p><textarea id="exText" rows="8" readonly class="paste">${esc(ex.text)}</textarea><div class="btnrow"><button class="btn small" id="exCopy">Másolás</button><button class="btn" id="exClose">Kész</button></div></div>`;

  return `<div class="section">
    <h2>Lista importálása</h2>
    <p class="hint">Illeszd be a kapott listát (pl. a Receptfüzet exportját vagy egy üzenetet). Soronként egy tétel; a mennyiség lehet elöl vagy hátul.</p>
    <textarea id="imText" rows="7" class="paste" placeholder="Receptfüzet lista: Aldi&#10;☐ tej – 2 l&#10;☐ kenyér – 1 db&#10;☐ WC-papír">${esc(im.text)}</textarea>
    <div class="btnrow"><button class="btn small" id="imPaste">Beillesztés a vágólapról</button><button class="btn small primary" id="imParse">Feldolgozás</button><button class="btn small" id="imCancel">Mégse</button></div>
    ${pv ? (pv.items.length ? `
      <div class="label">${pv.items.length} tétel${pv.fromReceptfuzet ? ` · a Receptfüzetből (${SHELF_INLINE} kamrába)` : ""}</div>
      <div class="rows">${pv.items.map(i => `<div class="irow"><span class="nm"><b>${i.done ? "☑ " : ""}${esc(i.name)}</b><small>${esc(guessDept(i.name))}</small></span><span class="qt">${i.qty != null ? esc(amountText(i.qty, i.unit)) : ""}</span><span></span></div>`).join("")}</div>
      <div class="field" id="imWhere"><span class="label">Hova kerüljön?</span>
        <label class="chk"><input type="radio" name="imTo" value="new" ${im.to === "new" ? "checked" : ""}> Új lista, ennél a boltnál:</label>
        ${storeChips(im.name)}
        ${unknown ? `<div class="btnrow"><button class="btn small" id="imAddStore">+ „${esc(unknown)}” felvétele a boltok közé</button></div>` : ""}
        <label class="chk"><input type="radio" name="imTo" value="draft" ${im.to === "draft" ? "checked" : ""}> Hozzáadás a Gyűjtőlistához</label>
      </div>
      <div class="btnrow"><button class="btn primary" id="imDo">Importálás (${pv.items.length} tétel)</button></div>`
      : `<p class="hint">Nem találtam tételt a szövegben.</p>`) : ""}
  </div>`;
}
function bindImport() {
  const ex = $("#exClose", V);
  if (ex) { $("#exText", V).select(); $("#exCopy", V).onclick = () => copyText(S.exportShow.text, "Másolva"); ex.onclick = () => { S.exportShow = null; renderLists(); }; return; }
  const op = $("#imOpen", V);
  if (op) { op.onclick = () => { S.importList = { text: "", parsed: null, name: "", to: "new" }; renderLists(); $("#imText", V).focus(); }; return; }
  const im = S.importList; if (!im) return;
  $("#imText", V).addEventListener("input", e => { im.text = e.target.value; });
  $("#imCancel", V).onclick = () => { S.importList = null; renderLists(); };
  const doParse = () => { const r = parseListText(im.text); im.parsed = r; im.name = knownStore(r.name); im.to = !r.name || norm(r.name) === norm("Gyűjtőlista") ? "draft" : "new"; renderLists(); };
  $("#imPaste", V).onclick = async () => {
    try { const t = await navigator.clipboard.readText(); if (t) { im.text = t; doParse(); return; } } catch (e) {}
    toast("Tartsd nyomva a szövegmezőt, és válaszd a Beillesztést"); $("#imText", V).focus();
  };
  $("#imParse", V).onclick = doParse;
  if (im.parsed?.items.length) {
    bindStoreChips($("#imWhere", V), name => { im.name = name; im.to = "new"; $('input[name="imTo"][value="new"]', V).checked = true; });
    const as = $("#imAddStore", V);
    if (as) as.onclick = async () => { const nm = im.parsed.name.trim(); S.stores.push(nm); await save.stores(); im.name = nm; im.to = "new"; renderLists(); toast(`„${nm}” a boltok között`); };
    $$('input[name="imTo"]', V).forEach(r => r.onchange = () => { im.to = r.value; });
    $("#imDo", V).onclick = async () => {
      let L;
      if (im.to === "new") {
        if (!im.name) { toast("Válaszd ki a boltot, vagy add a Gyűjtőlistához"); return; }
        L = storeList(im.name); L.updated = now();
      } else L = draftList();
      const src = im.parsed.fromReceptfuzet ? "receptfuzet" : "";
      for (const i of im.parsed.items) addItem(L, { name: i.name, qty: i.qty, unit: i.unit, src, done: i.done });
      const n = im.parsed.items.length; S.importList = null;
      await save.lists(); await save.products(); await save.ui(); renderLists();
      toast(im.to === "new" ? `${n} tétel a(z) „${L.name}” listán` : `${n} tétel a Gyűjtőlistán`);
    };
  }
}

   Közös adattár (ugyanaz a Google Apps Script híd, mint a Receptfüzeté; 2. verzió kell)
   ============================================================ */
/* Átadás a két alkalmazás között: a Drive-on az atadas.json ({ msgs: [üzenet…] }).
   üzenet = { id, from, to, type: "list"|"pantry", created, data, done: időbélyeg|null }
   – Küldés: a kimenő sorba kerül (offline is), a következő szinkronnál megy át; csak az elküldötteket vesszük ki a sorból.
   – Fogadás: a nekünk szóló, még kész-jelölés nélküli üzeneteket előbb „lefoglaljuk” (done = most, rev-alapú írással),
     és csak sikeres írás után alkalmazzuk. Így két készülék közül csak az egyik alkalmazza, és pontosan egyszer.
     A már alkalmazott azonosítókat a készülék is megjegyzi (S.handoff.applied).
   – A régi (1. verziós) híd a „doc” mezőt nem ismeri, és a Receptfüzet fájlját írná felül: ezért írás előtt ver >= 2 kell. */
const HID_VERZIO = 2;
const Handoff = {
  seen: null,
  queue(type, data) {
    const m = { id: uid(), from: APP_ID, to: PARTNER_ID, type, created: now(), data, done: null };
    S.handoff.outbox.push(m); save.handoff(); return m;
  },
  waiting(type) { return S.handoff.outbox.filter(m => !type || m.type === type).length; },
  async run(apply) {
    let total = 0;
    for (let attempt = 0; attempt < 4; attempt++) {
      const g = await Sync.call({ doc: "atadas", action: "get", since: null });
      S.sync.ver = g.ver || 1;
      if (S.sync.ver < HID_VERZIO) throw new Error(OLD_BRIDGE_MSG);
      const remote = Array.isArray(g.data?.msgs) ? g.data.msgs : [];
      const byId = new Map(remote.map(m => [m.id, { ...m }]));
      // Előző kör foglalása, amelynek a válasza elveszett: ha a Drive-on a mi időbélyegünk áll rajta, a miénk – alkalmazzuk most
      const pend = S.handoff.pending;
      if (pend) {
        const ours = pend.msgs.filter(m => byId.get(m.id)?.done === pend.at && !S.handoff.applied[m.id]);
        ours.forEach(m => { S.handoff.applied[m.id] = now(); });
        S.handoff.pending = null; await save.handoff();
        if (ours.length) { await this.safeApply(apply, ours); total += ours.length; }
      }
      const out = S.handoff.outbox.slice();
      for (const m of out) if (!byId.has(m.id)) byId.set(m.id, { ...m });
      const t = now();
      const mine = [...byId.values()].filter(m => m.to === APP_ID && !m.done);
      const fresh = mine.filter(m => !S.handoff.applied[m.id]);
      mine.forEach(m => { m.done = t; });
      const old = t - 30 * 864e5;   // a 30 napnál régebben kész üzenetek törlődnek
      const msgs = [...byId.values()].filter(m => !(m.done && m.done < old)).sort((a, b) => a.created - b.created || (a.id < b.id ? -1 : 1));
      if (this.seen) await this.seen(msgs);   // pl. értesítés minden készüléken, ne csak azon, amelyik alkalmazta
      if (!out.length && !mine.length && msgs.length === remote.length) return total;
      if (fresh.length) { S.handoff.pending = { at: t, msgs: fresh }; await save.handoff(); }
      const p = await Sync.call({ doc: "atadas", action: "put", baseRev: g.rev, data: { msgs } });
      if (p.conflict) { S.handoff.pending = null; await save.handoff(); continue; }
      const sent = new Set(out.map(m => m.id));
      S.handoff.outbox = S.handoff.outbox.filter(m => !sent.has(m.id));   // közben érkezett új üzenet a sorban marad
      // előbb jegyezzük meg, hogy alkalmaztuk – így egy közbeni hiba sem okozhat kétszeres hozzáadást
      fresh.forEach(m => { S.handoff.applied[m.id] = t; });
      for (const [id, at] of Object.entries(S.handoff.applied)) if (at < t - 90 * 864e5) delete S.handoff.applied[id];
      S.handoff.pending = null; await save.handoff();
      if (fresh.length) await this.safeApply(apply, fresh);
      return total + fresh.length;
    }
    throw new Error("Az átadás most nem sikerült, a következő szinkronnál újra próbálom.");
  },
  async safeApply(apply, msgs) {
    try { await apply(msgs); } catch (e) { console.error("Átadás alkalmazása:", e); toast("Hiba a beérkezett tételek feldolgozásakor: " + e.message); }
  }
};
const OLD_BRIDGE_MSG = "A híd program régi verziójú – frissítsd a Receptfüzetben (Beállítások → Közös adatbázis → Híd program frissítése).";
function snapshot() {
  const byId = (a, b) => a.id < b.id ? -1 : 1;
  return {
    v: 1,
    products: [...S.products.entries()].map(([key, p]) => ({ key, ...p })).sort((a, b) => a.key < b.key ? -1 : 1),
    productDel: S.productDel,
    lists: S.lists.map(l => ({ ...l, items: [...l.items].sort(byId) })).sort(byId),
    listDel: S.listDel,
    depts: { list: S.depts, updated: S.deptsUpdated },

    units: { list: S.units, updated: S.unitsUpdated }

}
function mergeData(L, R) {
  if (!R) return L;
  const pro = mergeById(L.products, R.products, L.productDel, R.productDel, x => x.key);
  const lst = mergeById(L.lists, R.lists, L.listDel, R.listDel, x => x.id);
  lst.items = lst.items.map(l => {
    const a = (L.lists || []).find(x => x.id === l.id), b = (R.lists || []).find(x => x.id === l.id);
    if (!a || !b) return l;
    const it = mergeById(a.items, b.items, a.itemDel, b.itemDel, x => x.id);

async function applyData(D) {

async function applyIncoming(msgs) {

    const items = (m.data.items || []).filter(i => i && String(i.name || "").trim());
    let L;
    if (m.data.kind === "closed") {
      const name = knownStore(m.data.name) || String(m.data.name || "Lista");
      if (!knownStore(name)) { S.stores.push(name); await save.stores(); }
      L = storeList(name); L.updated = now(); names.push(name);
    } else { L = draftList(); names.push("Gyűjtőlista"); }
    for (const i of items) addItem(L, { name: i.name, qty: i.qty == null ? null : Number(i.qty), unit: i.unit || "", src: "receptfuzet", note: i.note || "", done: !!i.done, staple: !!i.staple });
    n += items.length;
  }
  if (!n) return;

const Sync = {
  busy: false,
  async call(body, url = S.sync.url, key = S.sync.key) {
    let res;
    try { res = await fetch(url, { method: "POST", body: JSON.stringify({ key, ...body }), redirect: "follow" }); }
    catch (e) { throw new Error("Nem érem el a Google-t. Van internet?"); }
    let j; try { j = await res.json(); } catch (e) { throw new Error("A cím nem a közös adattárra mutat (rossz URL, vagy a hozzáférés nem „Bárki”)."); }
    if (!j.ok && !j.conflict) throw new Error(j.error || "Ismeretlen hiba");
    return j;
  },
  indicator() {
    const b = $("#syncBtn"); b.hidden = !S.sync.url;
    if (!S.sync.url) return;
    b.className = "syncbtn" + (S.sync.status === "busy" ? " busy" : S.sync.status === "err" ? " err" : "");
    $("#syncTxt").textContent = S.sync.status === "busy" ? "Szinkron…" : S.sync.status === "err" ? "Hiba" : S.sync.last ? fmtClock(S.sync.last) : "Drive";
    b.title = S.sync.status === "err" ? S.sync.error : "Szinkronizálás most";
  },
  async run(manual = false) {
    if (!S.sync.url || this.busy) return;
    this.busy = true; S.sync.status = "busy"; this.indicator();
    let changed = 0;
    if (S.sync.ver !== 1) {
      try { changed += await Handoff.run(applyIncoming); S.sync.herr = ""; }
      catch (e) { S.sync.herr = e.message; }
    }
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        const g = await this.call({ doc: "bevasarlo", action: "get", since: S.sync.rev });
        S.sync.ver = g.ver || 1;
        // a régi híd a Receptfüzet adatait adná vissza – nem olvassuk be, és nem írunk
        if (S.sync.ver < HID_VERZIO) throw new Error(OLD_BRIDGE_MSG);

        let data = local, needPut = S.sync.dirty;
        if (g.rev !== S.sync.rev) {

        }

          if (p.conflict) continue;

    } catch (e) { S.sync.status = "err"; S.sync.error = e.message; if (manual) toast(e.message); }
    await save.sync(); this.busy = false; this.indicator();
    if (changed && !isEditing()) render();
    else if (S.view === "lists" && !isEditing()) { const h = $(".callout", V); if (h || Handoff.waiting()) renderLists(); }

  }

async function startConnect(url, key) {

const NativeP = {};
function nativePlugin(name) {
  const Cap = window.Capacitor;

}
async function saveFile(name, text, mime) {
  try {
    const FS = nativePlugin("Filesystem"), SH = nativePlugin("Share");
    if (FS && SH) {
      const res = await FS.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });

      return;
    }
  } catch (e) { if (!/cancel/i.test(String(e?.message))) toast("Mentés: " + (e?.message || e)); return; }
  try {
    const file = new File([text], name, { type: mime });
    if (navigator.canShare?.({ files: [file] }) && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e?.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
    a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Mentve: " + name + " (ha nem jelent meg, használd a Másolás gombot)");
  } catch (e) { copyText(text, "A mentés nem sikerült, ezért a vágólapra másoltam"); }
}

  matches() {
    const all = this.units(), q = norm(this.inp.value);

  },
  pick(u) {
    const inp = this.inp; if (!inp) return;
    inp.value = u; this.hide(true);
    inp.dispatchEvent(new Event("input", { bubbles: true })); inp.dispatchEvent(new Event("change", { bubbles: true }));
  },
  hide(now) {
    clearTimeout(this.hideT);
    const go = () => { if (this.pop) this.pop.hidden = true; };
    if (now) go(); else this.hideT = setTimeout(() => { go(); this.inp = null; }, 150);
  }
};
document.addEventListener("focusin", e => { if (e.target.matches?.("input[data-unitpick]")) UnitPick.open(e.target); });
document.addEventListener("focusout", e => { if (e.target === UnitPick.inp) UnitPick.hide(false); });
document.addEventListener("input", e => { if (e.target === UnitPick.inp && e.isTrusted) UnitPick.draw(); });
// ha már fókuszban van, és újra rákoppintanak (pl. választás után), nyíljon le újra
document.addEventListener("click", e => { if (e.target.matches?.("input[data-unitpick]") && (!UnitPick.pop || UnitPick.pop.hidden)) UnitPick.open(e.target); });
document.addEventListener("keydown", e => {
  if (!UnitPick.pop || UnitPick.pop.hidden || e.target !== UnitPick.inp) return;
  const n = UnitPick.pop.children.length;
  if (e.key === "Escape") { UnitPick.hide(true); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); UnitPick.sel = (UnitPick.sel + (e.key === "ArrowDown" ? 1 : n - 1) + n) % n; UnitPick.draw(); UnitPick.pop.children[UnitPick.sel]?.scrollIntoView({ block: "nearest" }); return; }
  if (e.key === "Enter" && UnitPick.sel >= 0) { e.preventDefault(); e.stopImmediatePropagation(); UnitPick.pick(UnitPick.pop.children[UnitPick.sel].dataset.u); }
}, true);
["resize", "scroll"].forEach(t => { window.addEventListener(t, () => UnitPick.place(), { passive: true }); window.visualViewport?.addEventListener(t, () => UnitPick.place()); });
/* Beállítások → Mértékegységek, kiszerelések: a listát bővíteni lehet. A használat számát (unitUseCount) mindkét alkalmazás maga adja. */
function unitsSection() {
  return `<section class="section" id="unitSection">
      <h2>Mértékegységek, kiszerelések</h2>
      <p class="hint">Az alapegységek (${BASE_UNITS.join(", ")}) mindig megvannak. Saját egységet vagy kiszerelést is felvehetsz (pl. „pohár”, „karton”), és ezután a mértékegység-mezőkben választható. Ha megadod, mennyit ér (pl. 1 bögre = 250 ml), a program át is tudja váltani.</p>
      <div class="unitadd">
        <input id="unNew" placeholder="Új egység, pl. „karton”" aria-label="Új mértékegység vagy kiszerelés neve">
        <span class="eq">1 = </span>
        <input id="unFac" inputmode="decimal" placeholder="menny." aria-label="Mennyit ér">
        <select id="unBase" aria-label="Alapegység"><option value="">– nincs –</option>${BASE_UNITS.map(b => `<option>${b}</option>`).join("")}</select>
        <button class="btn small primary" id="unAdd">+ Hozzáad</button>
      </div>
      <div class="rows" id="unitList"></div>
    </section>`;
}
function bindUnitsSection() {
  const unAdd = async () => {
    const name = $("#unNew", V).value.trim().replace(/\.$/, ""); if (!name) { $("#unNew", V).focus(); return; }
    if (/\s/.test(name) || /\d/.test(name)) { toast("Az egység egy szó legyen, szám nélkül"); return; }
    if (BASE_UNITS.includes(canonUnit(name)) || S.units.some(u => norm(u.name) === norm(name))) { toast("Ilyen egység már van"); return; }
    const factor = parseNum($("#unFac", V).value), base = $("#unBase", V).value;
    if ((factor != null) !== !!base) { toast("Az átváltáshoz add meg a számot és az alapegységet is (vagy egyiket se)"); return; }
    S.units.push(base ? { name, base, factor } : { name }); await save.units();
    $("#unNew", V).value = ""; $("#unFac", V).value = ""; $("#unBase", V).value = "";
    drawUnits(); toast(`„${name}” hozzáadva`);
  };
  $("#unAdd", V).onclick = unAdd;
  ["#unNew", "#unFac"].forEach(id => $(id, V).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); unAdd(); } }));
  drawUnits();
}
function drawUnits() {
  const box = $("#unitList", V); if (!box) return;
  box.innerHTML = S.units.map((u, i) => {
    const n = unitUseCount(u.name), conf = S.unitConfirm === u.name;
    return `<div class="unitrow" data-i="${i}">
      <b>${esc(u.name)}</b>
      <span class="eq">1 ${esc(u.name)} =</span>
      <input data-fac inputmode="decimal" value="${numStr(u.factor ?? null)}" placeholder="–" aria-label="${esc(u.name)} mennyit ér">
      <select data-base aria-label="${esc(u.name)} alapegysége"><option value="">–</option>${BASE_UNITS.map(b => `<option ${u.base === b ? "selected" : ""}>${b}</option>`).join("")}</select>
      <span class="c">${n ? n + " helyen" : ""}</span>
      <button class="iconbtn" data-del aria-label="${esc(u.name)} törlése">${ICON_X}</button>
      ${conf ? `<div class="confirm">${n ? `${n} helyen használod; ott megmarad, csak a felajánlott egységek közül kerül ki.` : "Törlöd?"} <button class="btn small danger solid" data-yes>Törlés</button><button class="btn small" data-no>Mégse</button></div>` : ""}
    </div>`;
  }).join("") || `<p class="hint" style="padding:12px">Nincs saját egység.</p>`;
  $$(".unitrow", box).forEach(row => {
    const u = S.units[+row.dataset.i];
    const upd = async () => {
      const f = parseNum($("[data-fac]", row).value), b = $("[data-base]", row).value;
      if (f != null && b) { u.factor = f; u.base = b; } else if (f == null && !b) { delete u.factor; delete u.base; } else return;
      await save.units(); toast(u.base ? `1 ${u.name} = ${fmtNum(u.factor)} ${u.base}` : `${u.name}: átváltás nélkül`);
    };
    $("[data-fac]", row).addEventListener("change", upd); $("[data-base]", row).addEventListener("change", upd);
    $("[data-del]", row).onclick = () => { S.unitConfirm = u.name; drawUnits(); };
    const y = $("[data-yes]", row);
    if (y) { y.onclick = async () => { S.units = S.units.filter(x => x !== u); S.unitConfirm = null; await save.units(); drawUnits(); toast(`„${u.name}” törölve`); }; $("[data-no]", row).onclick = () => { S.unitConfirm = null; drawUnits(); }; }
  });
}
function drawStaples() {
  const box = $("#stapleList", V); if (!box) return;
  const list = [...S.staples].sort((a, b) => collator.compare(a.name, b.name));
  box.innerHTML = list.length ? `<div class="staplehead"><span></span><span>minimum</span><span>vegyél</span><span>egység</span><span></span></div>` + list.map(s => {
    const h = stapleHave(s), sent = inBevasarlo(s.name), conf = S.stapleConfirm === norm(s.name);
    return `<div class="staplerow" data-k="${esc(norm(s.name))}">
      <span class="nm"><b>${esc(s.name)}</b><small class="${h.low && !sent ? "low" : ""}">${sent ? "a Bevásárlóban" : esc(h.text)}</small></span>
      <input data-min inputmode="decimal" value="${numStr(s.min ?? null)}" placeholder="–" aria-label="${esc(s.name)}: minimum">
      <input data-buy inputmode="decimal" value="${numStr(s.buy ?? null)}" placeholder="–" aria-label="${esc(s.name)}: ennyit vegyél">
      <input data-unit data-unitpick autocomplete="off" value="${esc(s.unit || "")}" placeholder="–" aria-label="${esc(s.name)}: mértékegység">
      <button class="iconbtn" data-del aria-label="${esc(s.name)} törlése az alapvetők közül">${ICON_X}</button>
      ${conf ? `<div class="confirm">Leveszed az alapvetők közül? (A kamrából nem törlődik.) <button class="btn small danger solid" data-yes>Levétel</button><button class="btn small" data-no>Mégse</button></div>` : ""}
    </div>`;
  }).join("") : `<p class="hint" style="padding:12px">Még nincs alapvető élelmiszer. Vedd fel, amiből mindig legyen otthon (pl. tej, kenyér, tojás, liszt).</p>`;
  $$(".staplerow", box).forEach(row => {
    const s = S.staples.find(x => norm(x.name) === row.dataset.k); if (!s) return;
    const upd = async () => { s.min = parseNum($("[data-min]", row).value); s.buy = parseNum($("[data-buy]", row).value); s.unit = $("[data-unit]", row).value.trim(); await save.staples(); toast("Mentve");
      const h = stapleHave(s), sm = $(".nm small", row); if (!inBevasarlo(s.name)) { sm.textContent = h.text; sm.classList.toggle("low", h.low); } };
    $$("input", row).forEach(i => i.addEventListener("change", upd));
    $("[data-del]", row).onclick = () => { S.stapleConfirm = row.dataset.k; drawStaples(); };
    const y = $("[data-yes]", row);
    if (y) { y.onclick = async () => { S.staples = S.staples.filter(x => x !== s); S.stapleConfirm = null; await save.staples(); drawStaples(); toast(`„${s.name}” levéve az alapvetők közül`); }; $("[data-no]", row).onclick = () => { S.stapleConfirm = null; drawStaples(); }; }
  });
}

/* ============================================================
   Indítás
   ============================================================ */
(async function start() {
  await load();
  try { history.replaceState({ tab: "lists" }, ""); } catch (e) {}
  render();
  // Android vissza gomb: az előző fülre lép, a Listák fülön bezárja az alkalmazást
  const AppP = nativePlugin("App");
  if (AppP) AppP.addListener("backButton", () => { const st = history.state; if (st && st.tab !== "lists") history.back(); else AppP.exitApp(); });
  if (S.sync.url) Sync.run();
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Capacitor) {
    try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
  }
})();
</script>
