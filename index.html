<title>Receptfüzet</title>

<style>
/* Elrendezés: mobilos alkalmazás – felül fejléc, középen görgethető nézet, alul fix lapfül-sáv */
/* @@KOZOS stilus1 */
:root {
  --bg: #f4f7f3;
  --surface: #ffffff;
  --surface-2: #eaf0e9;
  --ink: #1b2820;
  --muted: #5a6a60;
  --line: #d6e0d6;
  --accent: #2e6b4a;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe1;
  --warm: #9a6a00;
  --warm-bg: #fbf0d4;
  --danger: #b3261e;
  --danger-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(20, 40, 28, .06), 0 4px 14px rgba(20, 40, 28, .06);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --radius: 14px;
  --tabbar-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #18201b; --surface-2: #202a24; --ink: #e5ece7; --muted: #98a89e;
    --line: #2a3530; --accent: #74c49b; --accent-ink: #0c1a12; --accent-soft: #1d3327;
    --warm: #e8b64e; --warm-bg: #33291a; --danger: #f0867c; --danger-soft: #3a1f1d;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201b; --surface-2: #202a24; --ink: #e5ece7; --muted: #98a89e;
  --line: #2a3530; --accent: #74c49b; --accent-ink: #0c1a12; --accent-soft: #1d3327;
  --warm: #e8b64e; --warm-bg: #33291a; --danger: #f0867c; --danger-soft: #3a1f1d;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  /* a ragadós fejléc így már a helyén áll (top: safe-area), nem csúszik rá a tartalomra */
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 60px; }
header.top h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
main .wrap { padding-block: 16px; display: flex; flex-direction: column; gap: 16px; }

/* Lapfülek */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .row { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
nav.tabs button {
  border: 0; background: none; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: .7rem; font-weight: 700; letter-spacing: .01em; padding: 0 2px; white-space: nowrap;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button.add span.plus { background: var(--accent); color: var(--accent-ink); border-radius: 10px; width: 40px; height: 24px; display: grid; place-items: center; }
nav.tabs button.add[aria-current="page"] span.plus { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Általános elemek */
.search { position: relative; }
.search input { width: 100%; padding: 12px 14px 12px 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
/* Egérrel (Windows) látsszon, hogy a sor oldalra görgethető */
@media (hover: hover) and (pointer: fine) {
  .chips { scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding-bottom: 6px; }
}
.chips.dragging { cursor: grabbing; user-select: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%;
}
.card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.thumb { width: 64px; height: 64px; border-radius: 10px; flex: none; background: var(--surface-2); object-fit: cover; display: grid; place-items: center; color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.card .t { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; }
.card .meta { color: var(--muted); font-size: .86rem; display: flex; gap: 10px; flex-wrap: wrap; }
.card .sub { color: var(--muted); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav { color: var(--warm); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 700; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.near { background: var(--warm-bg); color: var(--warm); }
.pill.demo { background: var(--surface-2); color: var(--muted); font-weight: 400; }
.missing { font-size: .86rem; color: var(--warm); }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.small { padding: 6px 12px; font-size: .9rem; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.section h2 { font-size: 1.15rem; }
.hint { color: var(--muted); font-size: .9rem; margin: 0; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

/* Űrlap */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field input, .field textarea, .field select, .ing-row input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; outline: none; min-width: 0;
}
.field input:focus, .field textarea:focus, .ing-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 .field:first-child { grid-column: 1 / -1; } }
.ing-rows { display: flex; flex-direction: column; gap: 8px; }
.ing-row { display: grid; grid-template-columns: 64px 76px 1fr auto auto; gap: 6px; align-items: center; }
.ing-row input { padding: 9px 8px; }
.ing-row label.opt { font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer; }
.iconbtn { border: 0; background: transparent; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--surface-2); }
.photo-prev { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; }

/* Recept nézet */
.hero-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius); }
.detail-head { display: flex; flex-direction: column; gap: 8px; }
.detail-head h2 { font-size: 1.9rem; letter-spacing: -.015em; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .9rem; }
.fact b { font-variant-numeric: tabular-nums; }
.scaler { display: inline-flex; align-items: center; gap: 4px; }
.scaler button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 700; }
.ings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ings li { display: grid; grid-template-columns: 18px 92px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
.ings li:last-child { border-bottom: 0; }
.ings .q { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); align-self: center; }
.dot.have { background: var(--accent); border-color: var(--accent); }
.ings .opt { color: var(--muted); font-size: .85rem; }
.steps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; max-width: 65ch; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: .9rem; }
.notes { white-space: pre-wrap; max-width: 65ch; margin: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* Kamra */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pantry-add { display: flex; gap: 8px; }
.pantry-add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 14px 8px 10px; cursor: pointer; user-select: none; min-width: 0; max-width: 100%;
}
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.check span.n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check span.c { margin-left: 2px; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.letter { flex-basis: 100%; font-family: var(--font-display); font-weight: 700; color: var(--muted); margin-top: 6px; }
.summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Importálás */
pre.sample { background: var(--surface-2); border-radius: 10px; padding: 12px; margin: 0; font-size: .85rem; overflow-x: auto; white-space: pre; line-height: 1.45; }
.preview-list { margin: 0; padding-left: 20px; }

/* Visszajelzés */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px); z-index: 20;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-weight: 700; max-width: calc(100% - 32px);
  box-shadow: var(--shadow);
}
@media (prefers-reduced-motion: no-preference) {
  .view-enter { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
/* @@KOZOS-VEGE stilus1 */
</style>
</head>

<style>
/* 3. verzió: kamra, bevásárlólisták, beállítások, szinkron */
/* @@KOZOS stilus2 */
nav.tabs button { position: relative; gap: 3px; }
nav.tabs button .ic { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .15s; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"] .ic { background: var(--accent); color: var(--accent-ink); }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
nav.tabs button.add .ic { background: var(--accent-soft); color: var(--accent); }
nav.tabs button.add[aria-current="page"] .ic { background: var(--accent); color: var(--accent-ink); }
.tabbadge { position: absolute; top: 3px; left: calc(50% + 10px); background: var(--warm); color: var(--surface); border-radius: 999px; font-size: .66rem; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.chip.add { border-style: dashed; color: var(--muted); }
.catpick { display: flex; flex-wrap: wrap; gap: 8px; }
.inline-add { display: flex; gap: 8px; }
.inline-add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
input[list]::-webkit-calendar-picker-indicator { display: none !important; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.unitadd { display: grid; grid-template-columns: minmax(0, 1fr) auto 72px 86px auto; gap: 6px; align-items: center; }
.unitadd input, .unitadd select, .unitrow input, .unitrow select { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px; }
.unitadd .eq, .unitrow .eq { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.unitrow { display: grid; grid-template-columns: minmax(56px, 1fr) auto 64px 70px auto auto; gap: 6px; align-items: center; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); }
.unitrow:first-child { border-top: 0; }
.unitrow .c { color: var(--muted); font-size: .76rem; white-space: nowrap; }
@media (max-width: 520px) {
  .unitadd { grid-template-columns: auto 1fr 1fr; } .unitadd > input:first-child { grid-column: 1 / -1; } .unitadd > button { grid-column: 1 / -1; }
  .unitrow { grid-template-columns: minmax(0, 1fr) 58px 64px auto; } .unitrow .eq, .unitrow .c { display: none; }
}
/* Alapvető élelmiszerek (Beállítások) és a Bevásárlóba felírt tételek jelzése */
.stapleadd { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px 66px auto; gap: 6px; align-items: center; }
.stapleadd input, .staplerow input { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px; }
.staplerow, .staplehead { display: grid; grid-template-columns: minmax(0, 1fr) 54px 54px 58px 36px; gap: 6px; align-items: center; padding: 6px 4px 6px 12px; border-top: 1px solid var(--line); }
.staplerow:first-child { border-top: 0; }
.staplehead { border-top: 0; padding-top: 0; padding-bottom: 0; color: var(--muted); font-size: .72rem; }
.staplerow .nm, .staplehead span:first-child { min-width: 0; }
.staplerow .nm b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.staplerow .nm small { display: block; color: var(--muted); font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staplerow .nm small.low { color: var(--danger); }
@media (max-width: 520px) { .stapleadd { grid-template-columns: 1fr 1fr 1fr; } .stapleadd > input:first-child, .stapleadd > button { grid-column: 1 / -1; } }
.sentlist { list-style: none; margin: 0; padding: 0; }
.sentlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 4px 0 4px 2px; border-top: 1px solid var(--line); }
.sentlist li:first-child { border-top: 0; }
.sentlist li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sentlist li b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.toolbar .grow { flex: 1; min-width: 0; }
.syncbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); cursor: pointer; flex: none; }
.syncbtn.err { color: var(--danger); border-color: var(--danger); }
.syncbtn.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Sorok: kamra és bevásárlás */
.rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row-letter { padding: 5px 14px; background: var(--surface-2); font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: .82rem; }
.irow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border-top: 1px solid var(--line); min-height: 54px; }
.row-letter + .irow, .rows > .irow:first-child, .rows > .ibox:first-child .irow { border-top: 0; }
.irow .nm { min-width: 0; }
.irow .nm b { font-weight: 400; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .nm small { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow .qt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.irow .qt.none { font-weight: 400; color: var(--muted); font-size: .85rem; }
.acts { display: flex; gap: 2px; }
.iconbtn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
.ibox.open { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.iform { display: grid; grid-template-columns: minmax(0, 1fr) 84px 76px; gap: 6px; padding: 0 12px 12px; }
.iform .full { grid-column: 1 / -1; }
.iform input { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; }
.iform input:focus, .addform input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

"use strict";
/* ============================================================

const Store = (() => {
  let db = null, mem = { recipes: new Map(), kv: new Map() }, ok = false;
  function open() {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open("receptfuzet", 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains("recipes")) d.createObjectStore("recipes", { keyPath: "id" });
          if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        };
        req.onsuccess = () => { db = req.result; ok = true; resolve(true); };
        req.onerror = () => resolve(false);
        req.onblocked = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  }
  function tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store);
      const r = fn(s);
      t.oncomplete = () => resolve(r && "result" in r ? r.result : undefined);
      t.onerror = () => reject(t.error);
    });
  }
  return {
    open,
    get persistent() { return ok; },
    async all() { return ok ? tx("recipes", "readonly", s => s.getAll()) : [...mem.recipes.values()]; },
    async putMany(list) { if (!list.length) return; if (ok) await tx("recipes", "readwrite", s => { list.forEach(r => s.put(r)); }); else list.forEach(r => mem.recipes.set(r.id, r)); },
    async delMany(ids) { if (!ids.length) return; if (ok) await tx("recipes", "readwrite", s => { ids.forEach(id => s.delete(id)); }); else ids.forEach(id => mem.recipes.delete(id)); },
    async clear() { if (ok) await tx("recipes", "readwrite", s => s.clear()); else mem.recipes.clear(); },
    async get(k) { return ok ? tx("kv", "readonly", s => s.get(k)) : mem.kv.get(k); },
    async set(k, v) { if (ok) await tx("kv", "readwrite", s => s.put(v, k)); else mem.kv.set(k, v); }
  };
})();

  $("#backBtn").hidden = !(S.view === "detail" || (S.view === "edit" && S.tab === "recipes"));
  updateBadge(); fillNames(); fillUnits(); Sync.indicator();
  V.classList.remove("view-enter"); void V.offsetWidth; V.classList.add("view-enter");
  ({ list: renderList, detail: renderDetail, edit: renderEdit, pantry: renderPantry, shop: renderShop, settings: renderSettings })[S.view]();
}
function updateBadge() { const n = openCount(), b = $("#shopBadge"); b.hidden = !n; b.textContent = n; }
function setTitle(t) { $("#title").textContent = t; document.title = t === "Receptek" ? "Receptfüzet" : t + " · Receptfüzet"; }
const ICON_CART = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.4a1.5 1.5 0 0 0 1.5 1.1h8.4a1.5 1.5 0 0 0 1.4-1.1L20 8H6"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/></svg>`;
const ICON_X = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const ICON_PEN = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>`;
const ICON_CHEV = `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;

function thumbHTML(r) { return `<div class="thumb">${r.photo ? `<img src="${r.photo}" alt="">` : esc((r.title[0] || "?").toUpperCase())}</div>`; }
function cardHTML(r, extra = "", scale = 1) {
  const meta = [r.categories.join(", "), fmtTime(r.time), r.servings ? fmtNum(r.servings) + " adag" + (r.days ? " · " + dayText(r.days) : "") : ""].filter(Boolean).map(esc).join(" · ");
  const demo = r.tags.includes("minta") ? ` <span class="pill demo">minta</span>` : "";
  return `<button class="card" data-open="${esc(r.id)}" data-scale="${scale}">${thumbHTML(r)}
    <div class="body"><div class="t">${r.favorite ? '<span class="fav" aria-label="kedvenc">★</span> ' : ""}${esc(r.title)}${demo}</div>
    <div class="meta">${meta}</div>${extra || `<div class="sub">${esc(r.ingredients.map(i => i.name).join(", "))}</div>`}</div></button>`;
}
function bindOpen(root = V) {
  $$("[data-open]", root).forEach(b => b.addEventListener("click", () => { S.scale = parseFloat(b.dataset.scale) || 1; go(S.tab, "detail", b.dataset.open); }));
}

/* ---------- Receptlista ---------- */
function filteredRecipes() {
  const toks = norm(S.q).split(" ").filter(Boolean);
  const cf = S.catFilter.map(norm);
  return S.recipes.filter(r => {
    if (cf.length) { const rc = r.categories.map(norm); if (!cf.every(c => rc.includes(c))) return false; }
    if (S.favOnly && !r.favorite) return false;
    if (!toks.length) return true;
    const hay = norm([r.title, r.categories.join(" "), r.tags.join(" "), r.ingredients.map(i => i.name).join(" "), r.steps, r.notes].join(" "));
    return toks.every(t => hay.includes(t));
  });
}
function renderList() {
  setTitle("Receptek");
  const cats = allCategories().filter(c => catCount(c) > 0);
  const on = c => S.catFilter.some(x => norm(x) === norm(c));
  V.innerHTML = `
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Keresés: név, hozzávaló, címke…" value="${esc(S.q)}" autocomplete="off" aria-label="Keresés a receptek között"></div>
    <div class="chips" role="group" aria-label="Szűrés kategóriára">
      <button class="chip" data-all aria-pressed="${!S.catFilter.length && !S.favOnly}">Összes</button>
      <button class="chip" data-fav aria-pressed="${S.favOnly}">★ Kedvencek</button>
      ${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${on(c)}">${esc(c)}</button>`).join("")}
      <button class="chip add" data-editcats>✎ Kategóriák</button>
    </div>
    <div class="count" id="cnt"></div>
    <div class="list" id="list"></div>`;
  const q = $("#q", V);
  q.addEventListener("input", () => { S.q = q.value; drawList(); });
  $$("[data-cat]", V).forEach(b => b.addEventListener("click", () => {
    const c = b.dataset.cat; S.catFilter = on(c) ? S.catFilter.filter(x => norm(x) !== norm(c)) : [...S.catFilter, c]; renderList();
  }));
  $("[data-all]", V).onclick = () => { S.catFilter = []; S.favOnly = false; renderList(); };
  $("[data-fav]", V).onclick = () => { S.favOnly = !S.favOnly; renderList(); };
  $("[data-editcats]", V).onclick = () => { go("settings"); setTimeout(() => $("#catSection")?.scrollIntoView({ block: "start" }), 50); };
  drawList();
}
function drawList() {
  const list = filteredRecipes();
  const fl = S.catFilter.length > 1 ? ` · mindegyik kategóriában: ${S.catFilter.join(" + ")}` : "";
  $("#cnt", V).textContent = S.recipes.length ? `${list.length} / ${S.recipes.length} recept${fl}` : "";
  const L = $("#list", V);
  if (!S.recipes.length) {
    L.innerHTML = `<div class="empty"><p>Még nincs recepted. Vidd fel az elsőt, vagy importáld a meglévőket egyszerre a Beállításokban.</p>
      <div class="btnrow"><button class="btn primary" id="e1">Új recept</button><button class="btn" id="e2">Receptek importálása</button></div></div>`;
    $("#e1", L).onclick = () => $('nav.tabs [data-tab="new"]').click();
    $("#e2", L).onclick = () => { go("settings"); setTimeout(() => $("#impSection")?.scrollIntoView({ block: "start" }), 50); };
    return;
  }
  L.innerHTML = list.length ? list.map(r => cardHTML(r)).join("") : `<div class="empty"><p>Nincs találat.</p></div>`;
  bindOpen(L);
}

/* ---------- Recept részletei ---------- */
function renderDetail() {
  const r = S.recipes.find(x => x.id === S.current);
  if (!r) { go("recipes", "list", null, false); return; }
  setTitle(r.title);
  const f = S.scale;
  const servings = r.servings ? r.servings * f : 0;
  const ev = evalRecipe(r, f);
  const status = ev.req.length ? (ev.problems.length === 0 ? `<span class="pill ok">✓ Minden megvan a kamrában</span>` : `<span class="pill near">Hiányzik / kevés: ${ev.problems.length}</span>`) : "";
  const steps = r.steps.split("\n").map(s => s.trim()).filter(Boolean);
  const stText = x => {
    if (x.state === "missing") return `<span class="st warn">nincs a kamrában${x.need != null ? " · kell " + esc(amountText(x.need, x.unit)) : ""}</span>`;
    if (x.state === "short") return `<span class="st warn">kamrában ${esc(amountText(x.have.qty, x.have.unit))} · még ${esc(amountText(x.lack, x.unit))} kell</span>`;
    if (x.have?.qty != null) return `<span class="st">kamrában ${esc(amountText(x.have.qty, x.have.unit))}${x.incomparable ? " (más mértékegység)" : ""}</span>`;
    return "";
  };
  const ci = S.cookInfo;
  V.innerHTML = `
    ${r.photo ? `<img class="hero-img" src="${r.photo}" alt="${esc(r.title)}">` : ""}
    <div class="detail-head">
      <h2>${esc(r.title)}</h2>
      <div class="facts">
        ${r.servings ? `<span class="fact scaler"><button id="sm" aria-label="Kevesebb adag">−</button> <b>${fmtNum(servings)}</b> adag <button id="sp" aria-label="Több adag">+</button></span>` : ""}
        ${r.days ? `<span class="fact">📅 <b>${dayText(r.days * f)}</b> elég</span>` : ""}
        ${r.time ? `<span class="fact">⏱ <b>${fmtTime(r.time)}</b></span>` : ""}
        ${status}
      </div>
      ${r.categories.length || r.tags.length ? `<div class="tags">${r.categories.map(c => `<span class="pill ok">${esc(c)}</span>`).join("")}${r.tags.map(t => `<span class="pill demo">${esc(t)}</span>`).join("")}</div>` : ""}
      ${ev.maxServ != null && r.servings ? `<p class="hint">A kamrában lévőkből legfeljebb <b>${fmtNum(ev.maxServ)} adag</b> főzhető${r.days ? ` (${dayText(r.days * ev.maxServ / r.servings)})` : ""}.</p>` : ""}
    </div>
    ${ci ? `<div class="callout ${ci.out.length ? "" : "ok"}"><b>Levontam a kamrából a felhasznált mennyiségeket.</b>${ci.sent?.length ? `<span>Alapvető, fogytán van – ${ci.viaApp ? "felírtam a Bevásárlóba (bolt nélkül)" : "felírtam a Gyűjtőlistára"}: ${esc(sentText(ci.sent))}</span>` : ""}${ci.out.length ? `<span>Elfogyott: ${esc(ci.out.join(", "))}</span><div class="btnrow"><button class="btn small primary" id="ciShop">Felírom a Gyűjtőlistára</button></div>` : ""}</div>` : ""}
    <section class="section">
      <h2>Hozzávalók</h2>
      <ul class="ings">${r.ingredients.map(x => {
        const s = ev.items.find(y => y.ing === x);
        return `<li><span class="dot ${s.state}" title="${s.state === "ok" ? "Van a kamrában" : s.state === "short" ? "Kevés van" : "Nincs a kamrában"}"></span>
          <span class="q">${esc([scaleQty(x.qty, f), x.unit].filter(Boolean).join(" "))}</span>
          <span>${esc(x.name)}${x.optional ? ' <span class="opt">(elhagyható)</span>' : ""}</span>${stText(s)}</li>`;
      }).join("") || `<li><span></span><span></span><span class="hint">Nincs megadva hozzávaló.</span></li>`}</ul>
      <div class="btnrow">
        ${ev.problems.length ? `<button class="btn small primary" id="toShop">${ICON_CART} Ami hiányzik, a Gyűjtőlistára (${ev.problems.length})</button>` : ""}
        ${S.confirm === "cook"
          ? `<span class="btnrow"><button class="btn small primary" id="cookYes">Igen, vond le ${fmtNum(servings)} adag mennyiségét</button><button class="btn small" id="cookNo">Mégse</button></span>`
          : `<button class="btn small" id="cook">Megfőztem – levonás a kamrából</button>`}
      </div>
    </section>
    ${steps.length ? `<section class="section"><h2>Elkészítés</h2><ol class="steps">${steps.map(s => `<li><span>${esc(s.replace(/^\d+[.)]\s*/, ""))}</span></li>`).join("")}</ol></section>` : ""}
    ${r.notes ? `<section class="section"><h2>Megjegyzés</h2><p class="notes">${esc(r.notes)}</p></section>` : ""}
    <div class="btnrow">
      <button class="btn primary" id="edit">Szerkesztés</button>
      <button class="btn" id="fav">${r.favorite ? "★ Kedvenc" : "☆ Kedvencekhez"}</button>
      <button class="btn" id="share">Megosztás</button>
      ${S.confirm === "del"
        ? `<span class="btnrow"><button class="btn danger solid" id="delYes">Igen, törlöm</button><button class="btn" id="delNo">Mégse</button></span>`
        : `<button class="btn danger" id="del">Törlés</button>`}
    </div>`;
  if (r.servings) {
    const step = 1 / r.servings;
    $("#sm", V).onclick = () => { S.scale = Math.max(step, Math.round((S.scale - step) * r.servings) / r.servings); S.cookInfo = null; renderDetail(); };
    $("#sp", V).onclick = () => { S.scale = Math.round((S.scale + step) * r.servings) / r.servings; S.cookInfo = null; renderDetail(); };
  }
  const ts = $("#toShop", V);
  if (ts) ts.onclick = async () => {
    const skip = ev.problems.filter(x => inBevasarlo(x.ing.name)), add = ev.problems.filter(x => !skip.includes(x));
    for (const x of add) addToShop(x.ing.name, x.state === "short" ? x.lack : x.need, x.unit, r.title);
    await save.lists(); toast(`${add.length} tétel a Gyűjtőlistán` + (skip.length ? ` · már a Bevásárlóban: ${skip.map(x => x.ing.name).join(", ")}` : ""));
  };
  if (S.confirm === "cook") {
    $("#cookYes", V).onclick = async () => {
      const out = [], used = [];
      for (const x of ev.items) {
        const k = norm(x.ing.name), p = S.pantry.get(k); if (!p || x.need == null || p.qty == null) continue;
        const use = convert(x.need, x.unit, p.unit); if (use == null) continue;
        p.qty = Math.round((p.qty - use) * 1000) / 1000; p.updated = now(); used.push(k);
        if (p.qty <= 0) { pantryRemove(k); out.push(p.name); }
      }
      await save.pantry();
      const sent = await checkStaples(used);
      // ami alapvetőként már felkerült (vagy a Bevásárlóban van), azt nem ajánljuk fel még egyszer
      S.confirm = null; S.cookInfo = { out: out.filter(n => !stapleOf(n) && !inBevasarlo(n)), sent, viaApp: sendState() === "ok" }; renderDetail();
    };
    $("#cookNo", V).onclick = () => { S.confirm = null; renderDetail(); };
  } else $("#cook", V).onclick = () => { S.confirm = "cook"; S.cookInfo = null; renderDetail(); };
  const cs = $("#ciShop", V);
  if (cs) cs.onclick = async () => { ci.out.forEach(n => addToShop(n, null, S.known.get(norm(n))?.unit || "", r.title)); await save.lists(); S.cookInfo = null; renderDetail(); toast("Felírva a Gyűjtőlistára"); };
  $("#edit", V).onclick = () => { S.editing = structuredClone(r); go("recipes", "edit", r.id); };
  $("#fav", V).onclick = async () => { r.favorite = !r.favorite; await save.recipes([r]); renderDetail(); };
  $("#share", V).onclick = () => shareText(r.title, recipeToText(r));
  if (S.confirm === "del") {
    $("#delYes", V).onclick = async () => { await save.delRecipes([r.id]); S.recipes = S.recipes.filter(x => x.id !== r.id); toast("Recept törölve"); go("recipes", "list"); };
    $("#delNo", V).onclick = () => { S.confirm = null; renderDetail(); };
  } else $("#del", V).onclick = () => { S.confirm = "del"; renderDetail(); };
}

/* ---------- Szerkesztő ---------- */
function renderEdit() {
  if (!S.editing) { const src = S.recipes.find(x => x.id === S.current); S.editing = src ? structuredClone(src) : Object.assign(blankRecipe(), { ingredients: [{ qty: "", unit: "", name: "", optional: false }] }); }
  const r = S.editing;
  const isNew = !S.recipes.some(x => x.id === r.id);
  setTitle(isNew ? "Új recept" : "Szerkesztés");
  V.innerHTML = `
    <section class="section">
      <div class="field"><label class="label" for="f-title">Recept neve</label><input id="f-title" value="${esc(r.title)}" placeholder="pl. Rakott krumpli" required></div>
      <div class="grid3">
        <div class="field"><label class="label" for="f-serv">Adag</label><input id="f-serv" type="number" inputmode="decimal" min="0" step="any" value="${r.servings || ""}"></div>
        <div class="field"><label class="label" for="f-days">Hány napra elég</label><input id="f-days" type="number" inputmode="decimal" min="0" step="any" value="${r.days || ""}" placeholder="pl. 2"></div>
        <div class="field"><label class="label" for="f-time">Idő (perc)</label><input id="f-time" type="number" inputmode="numeric" min="0" value="${r.time || ""}"></div>
      </div>
      <p class="hint">A „Hány napra elég” azt mondja meg, hogy a fenti adagszám hány napig elég. Ebből számolja a program, mennyit kell főzni adott számú napra.</p>
    </section>
    <section class="section">
      <h2>Kategóriák</h2>
      <p class="hint">Annyit jelölj be, amennyi illik rá.</p>
      <div class="catpick" id="catpick"></div>
      <div class="inline-add"><input id="newCat" placeholder="Új kategória neve" aria-label="Új kategória"><button class="btn small" id="addCat">+ Hozzáad</button></div>
      <div class="field"><label class="label" for="f-tags">Címkék, vesszővel (szabad szavak)</label><input id="f-tags" value="${esc(r.tags.join(", "))}" placeholder="gyors, nagyi, ünnepi"></div>
    </section>
    <section class="section">
      <h2>Hozzávalók</h2>
      <p class="hint">Mennyiség · mérték · megnevezés. Ugyanazt a nevet használd, mint a kamrában (a felajánlott listából), mert a program név szerint párosít.</p>
      <div class="ing-rows" id="ings"></div>
      <div class="btnrow"><button class="btn small" id="addIng">+ Sor</button><button class="btn small" id="pasteIng">Beillesztés szövegből</button></div>
      <div id="pasteBox" hidden class="field">
        <label class="label" for="f-paste">Soronként egy hozzávaló</label>
        <textarea id="f-paste" placeholder="250 g finomliszt&#10;3 db tojás&#10;5 dl tej&#10;só"></textarea>
        <div class="btnrow"><button class="btn small primary" id="pasteDo">Hozzáadás</button></div>
      </div>
    </section>
    <section class="section">
      <div class="field"><label class="label" for="f-steps">Elkészítés – soronként egy lépés</label><textarea id="f-steps" rows="7">${esc(r.steps)}</textarea></div>
      <div class="field"><label class="label" for="f-notes">Megjegyzés, forrás</label><textarea id="f-notes" rows="3" style="min-height:70px">${esc(r.notes)}</textarea></div>
      <div class="field"><span class="label">Fotó</span>
        ${r.photo ? `<img class="photo-prev" src="${r.photo}" alt="">` : ""}
        <div class="btnrow"><label class="btn small" for="f-photo">${r.photo ? "Fotó cseréje" : "Fotó hozzáadása"}</label>${r.photo ? `<button class="btn small danger" id="rmPhoto">Fotó törlése</button>` : ""}</div>
        <input id="f-photo" type="file" accept="image/*" hidden>
      </div>
    </section>
    <div class="btnrow"><button class="btn primary" id="save">Mentés</button><button class="btn" id="cancel">Mégse</button></div>`;
  drawIngRows(); drawCatPick();
  const bindField = (id, fn) => $(id, V).addEventListener("input", e => fn(e.target.value));
  bindField("#f-title", v => r.title = v);
  bindField("#f-serv", v => r.servings = parseNum(v) || 0); bindField("#f-days", v => r.days = parseNum(v) || 0); bindField("#f-time", v => r.time = parseInt(v) || 0);
  bindField("#f-tags", v => r.tags = v.split(",").map(t => t.trim()).filter(Boolean));
  bindField("#f-steps", v => r.steps = v); bindField("#f-notes", v => r.notes = v);
  const addCat = async () => {
    const v = $("#newCat", V).value.trim(); if (!v) return;
    if (!allCategories().some(c => norm(c) === norm(v))) { S.cats.push(v); await save.cats(); }
    const name = allCategories().find(c => norm(c) === norm(v));
    if (!r.categories.some(c => norm(c) === norm(v))) r.categories.push(name);
    $("#newCat", V).value = ""; drawCatPick();
  };
  $("#addCat", V).onclick = addCat;
  $("#newCat", V).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addCat(); } });
  $("#addIng", V).onclick = () => { r.ingredients.push({ qty: "", unit: "", name: "", optional: false }); drawIngRows(true); };
  $("#pasteIng", V).onclick = () => { $("#pasteBox", V).hidden = !$("#pasteBox", V).hidden; $("#f-paste", V).focus(); };
  $("#pasteDo", V).onclick = () => {
    const add = $("#f-paste", V).value.split("\n").map(parseIngredient).filter(Boolean);
    r.ingredients = r.ingredients.filter(i => i.name.trim()).concat(add);
    $("#f-paste", V).value = ""; $("#pasteBox", V).hidden = true; drawIngRows(); toast(add.length + " hozzávaló hozzáadva");
  };
  $("#f-photo", V).onchange = async e => { const file = e.target.files[0]; if (!file) return; try { r.photo = await resizeImage(file); renderEdit(); } catch (err) { toast("A képet nem sikerült beolvasni"); } };
  if (r.photo) $("#rmPhoto", V).onclick = () => { r.photo = ""; r.photoKey = ""; renderEdit(); };
  $("#cancel", V).onclick = () => { S.editing = null; if (isNew) go("recipes"); else history.back(); };
  $("#save", V).onclick = async () => {
    if (!r.title.trim()) { toast("Adj nevet a receptnek"); $("#f-title", V).focus(); return; }
    r.ingredients = r.ingredients.map(i => ({ ...i, name: i.name.trim(), qty: String(i.qty).trim(), unit: i.unit.trim() })).filter(i => i.name);
    if (!r.photo) r.photoKey = "";
    const saved = cleanRecipe(r);
    await save.recipes([saved]);
    const k = S.recipes.findIndex(x => x.id === saved.id);
    if (k >= 0) S.recipes[k] = saved; else S.recipes.push(saved);
    sortRecipes(); S.editing = null;
    toast(isNew ? "Recept elmentve" : "Változások elmentve");
    if (isNew) { S.scale = 1; go("recipes", "detail", saved.id); } else history.back();
  };
}
function drawCatPick() {
  const r = S.editing, box = $("#catpick", V);
  const on = c => r.categories.some(x => norm(x) === norm(c));
  box.innerHTML = allCategories().map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="${on(c)}">${on(c) ? "✓ " : ""}${esc(c)}</button>`).join("");
  $$("[data-c]", box).forEach(b => b.onclick = () => {
    const c = b.dataset.c; r.categories = on(c) ? r.categories.filter(x => norm(x) !== norm(c)) : [...r.categories, c]; drawCatPick();
  });
}
function drawIngRows(focusLast = false) {
  const r = S.editing, box = $("#ings", V);
  box.innerHTML = r.ingredients.map((i, k) => `
    <div class="ing-row" data-k="${k}">
      <input aria-label="Mennyiség" placeholder="250" value="${esc(i.qty)}" data-f="qty" inputmode="decimal">
      <input aria-label="Mértékegység" placeholder="g" value="${esc(i.unit)}" data-f="unit" data-unitpick autocomplete="off">
      <input aria-label="Hozzávaló neve" placeholder="finomliszt" value="${esc(i.name)}" data-f="name" list="dl-names">
      <label class="opt" title="Elhagyható – nem kell az egyezéshez"><input type="checkbox" data-f="optional" ${i.optional ? "checked" : ""}>elh.</label>
      <button class="iconbtn" data-rm aria-label="Sor törlése">${ICON_X}</button>
    </div>`).join("");

function resizeImage(file, max = 900) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", .72));
    };
    img.onerror = reject; img.src = url;
  });
}

/* Egy beillesztett lista értelmezése. Elfogadja a saját exportot és a kézzel írt listákat is:
   „☐ tej – 2 l”, „- 2 l tej”, „tej 2 l”, „[x] kenyér”, „3. vaj 250 g”, „tojás x10” */
/* @@KOZOS listaszoveg */
const DONE_MARK = /^(☑|✓|✔|✅|\[x\]|\(x\))\s*/i;
const TODO_MARK = /^(☐|□|▢|⬜|\[ \]|\[\]|\( \)|[-*•·–]|\d+[.)])\s*/;
/* Visszaadja: { name, items, kind: "lista"|"kamra"|"", fromReceptfuzet } – a „Receptfüzet lista/kamra:” fejlécet is felismeri */
function parseListText(text) {
  const lines = String(text).replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => l.replace(/^\[\d{1,2}:\d{2}.*?\]\s*[^:]{1,40}:\s*/, ""));     // csevegőalkalmazás időbélyege, feladó
  let name = "", start = 0, kind = "", fromReceptfuzet = false;
  if (lines.length) {
    const m = lines[0].match(/^(?:🛒\s*)?(?:receptfüzet\s+|bevásárló\s+)?(?:bevásárló)?(lista|kamra)\s*[:\-–]\s*(.+)$/i);
    const marked = l => DONE_MARK.test(l) || TODO_MARK.test(l);
    if (m) { kind = m[1].toLowerCase(); name = m[2].trim(); start = 1; fromReceptfuzet = /^(?:🛒\s*)?receptfüzet/i.test(lines[0]); }
    else if (lines.length > 1 && !marked(lines[0]) && lines.slice(1).some(marked) && !/\d/.test(lines[0])) { name = lines[0].replace(/[:.]\s*$/, ""); start = 1; }
  }
  if (/^bevásárlólista$/i.test(name)) name = "";
  const items = [];
  for (let line of lines.slice(start)) {
    let done = false;
    for (let k = 0; k < 2; k++) {
      if (DONE_MARK.test(line)) { done = true; line = line.replace(DONE_MARK, ""); }
      else line = line.replace(TODO_MARK, "");
    }
    line = line.trim(); if (!line || /^(receptfüzet|bevásárló)\s+(lista|kamra)/i.test(line)) continue;
    let nm = line, qty = null, unit = "";
    const dash = line.match(/^(.+?)\s+[–—-]\s+(.+)$/) || line.match(/^(.+?):\s*(.+)$/);
    const qtyOf = t => { const i = parseIngredient(t + " x"); return i && i.qty ? { q: firstNum(i.qty), u: i.unit } : null; };
    if (dash && qtyOf(dash[2])) { nm = dash[1]; const r = qtyOf(dash[2]); qty = r.q; unit = r.u; }
    else {
      let m = line.match(/^(.+?)\s+[x×]\s*(\d+(?:[.,]\d+)?)$/i) || line.match(/^(\d+(?:[.,]\d+)?)\s*[x×]\s+(.+)$/i);
      if (m) { const numFirst = /^\d/.test(m[1]); nm = numFirst ? m[2] : m[1]; qty = parseNum(numFirst ? m[1] : m[2]); unit = "db"; }
      else {
        m = line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?|fél)\s*([^\s\d]*)$/i);
        if (m && (!m[3] || isUnit(m[3]))) { nm = m[1]; qty = parseNum(m[2]); unit = m[3].replace(/\.$/, ""); }
        else { const i = parseIngredient(line); if (i) { nm = i.name; qty = firstNum(i.qty); unit = i.unit || (qty != null ? "db" : ""); } }
      }
    }
    nm = nm.replace(/[,;.]+$/, "").trim(); if (!nm) continue;
    items.push({ name: nm, qty, unit, done });
  }
  return { name, items, kind, fromReceptfuzet };
}

function storeList(name) {

/* Átadás a két alkalmazás között: a Drive-on az atadas.json ({ msgs: [üzenet…] }).
   üzenet = { id, from, to, type: "list"|"pantry", created, data, done: időbélyeg|null }
   – Küldés: a kimenő sorba kerül (offline is), a következő szinkronnál megy át; csak az elküldötteket vesszük ki a sorból.
   – Fogadás: a nekünk szóló, még kész-jelölés nélküli üzeneteket előbb „lefoglaljuk” (done = most, rev-alapú írással),
     és csak sikeres írás után alkalmazzuk. Így két készülék közül csak az egyik alkalmazza, és pontosan egyszer.
     A már alkalmazott azonosítókat a készülék is megjegyzi (S.handoff.applied).
   – A régi (1. verziós) híd a „doc” mezőt nem ismeri, és a Receptfüzet fájlját írná felül: ezért írás előtt ver >= 2 kell. */
const HID_VERZIO = 2;
const Handoff = {
  seen: null,
  queue(type, data) {
    const m = { id: uid(), from: APP_ID, to: PARTNER_ID, type, created: now(), data, done: null };
    S.handoff.outbox.push(m); save.handoff(); return m;
  },
  waiting(type) { return S.handoff.outbox.filter(m => !type || m.type === type).length; },
  async run(apply) {
    let total = 0;
    for (let attempt = 0; attempt < 4; attempt++) {
      const g = await Sync.call({ doc: "atadas", action: "get", since: null });
      S.sync.ver = g.ver || 1;
      if (S.sync.ver < HID_VERZIO) throw new Error(OLD_BRIDGE_MSG);
      const remote = Array.isArray(g.data?.msgs) ? g.data.msgs : [];
      const byId = new Map(remote.map(m => [m.id, { ...m }]));
      // Előző kör foglalása, amelynek a válasza elveszett: ha a Drive-on a mi időbélyegünk áll rajta, a miénk – alkalmazzuk most
      const pend = S.handoff.pending;
      if (pend) {
        const ours = pend.msgs.filter(m => byId.get(m.id)?.done === pend.at && !S.handoff.applied[m.id]);
        ours.forEach(m => { S.handoff.applied[m.id] = now(); });
        S.handoff.pending = null; await save.handoff();
        if (ours.length) { await this.safeApply(apply, ours); total += ours.length; }
      }
      const out = S.handoff.outbox.slice();
      for (const m of out) if (!byId.has(m.id)) byId.set(m.id, { ...m });
      const t = now();
      const mine = [...byId.values()].filter(m => m.to === APP_ID && !m.done);
      const fresh = mine.filter(m => !S.handoff.applied[m.id]);
      mine.forEach(m => { m.done = t; });
      const old = t - 30 * 864e5;   // a 30 napnál régebben kész üzenetek törlődnek
      const msgs = [...byId.values()].filter(m => !(m.done && m.done < old)).sort((a, b) => a.created - b.created || (a.id < b.id ? -1 : 1));
      if (this.seen) await this.seen(msgs);   // pl. értesítés minden készüléken, ne csak azon, amelyik alkalmazta
      if (!out.length && !mine.length && msgs.length === remote.length) return total;
      if (fresh.length) { S.handoff.pending = { at: t, msgs: fresh }; await save.handoff(); }
      const p = await Sync.call({ doc: "atadas", action: "put", baseRev: g.rev, data: { msgs } });
      if (p.conflict) { S.handoff.pending = null; await save.handoff(); continue; }
      const sent = new Set(out.map(m => m.id));
      S.handoff.outbox = S.handoff.outbox.filter(m => !sent.has(m.id));   // közben érkezett új üzenet a sorban marad
      // előbb jegyezzük meg, hogy alkalmaztuk – így egy közbeni hiba sem okozhat kétszeres hozzáadást
      fresh.forEach(m => { S.handoff.applied[m.id] = t; });
      for (const [id, at] of Object.entries(S.handoff.applied)) if (at < t - 90 * 864e5) delete S.handoff.applied[id];
      S.handoff.pending = null; await save.handoff();
      if (fresh.length) await this.safeApply(apply, fresh);
      return total + fresh.length;
    }
    throw new Error("Az átadás most nem sikerült, a következő szinkronnál újra próbálom.");
  },
  async safeApply(apply, msgs) {
    try { await apply(msgs); } catch (e) { console.error("Átadás alkalmazása:", e); toast("Hiba a beérkezett tételek feldolgozásakor: " + e.message); }
  }
};

const OLD_BRIDGE_MSG = "A híd program régi verziójú – frissítsd (Beállítások → Híd program frissítése).";
/* Beérkezett üzenetek a Bevásárlóból: a megvett kamratételek */
const pantryMsgItems = m => (m.data?.items || []).filter(i => i && String(i.name || "").trim());
async function applyIncoming(msgs) {
  let n = 0;
  for (const m of msgs) {
    if (m.type !== "pantry") continue;
    const items = pantryMsgItems(m);
    items.forEach(i => { addToPantry(String(i.name).trim(), i.qty == null ? null : Number(i.qty), i.unit || ""); stapleClear(norm(i.name)); });
    n += items.length;

}

    if (m.to !== APP_ID || m.type !== "pantry" || !m.done || (m.created || 0) < cut) continue;
    if (S.pantryNotes.some(x => x.id === m.id) || S.handoff.noteOk?.[m.id]) continue;
    const items = pantryMsgItems(m); if (!items.length) continue;
    S.pantryNotes.push({ id: m.id, list: m.data.listName || "", at: m.created || now(), items: items.map(i => ({ name: i.name, qty: i.qty ?? null, unit: i.unit || "" })) }); add++;

};

async function startConnect(url, key) {
  const msg = $("#connMsg", V);
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(url)) { msg.textContent = "A címnek https://script.google.com/… kezdetűnek kell lennie."; return; }
  msg.textContent = "Kapcsolódás…";
  try {
    const g = await Sync.call({ action: "get", since: -1 }, url, key);
    const D = g.data;
    const ch = { url, key, rev: g.rev, data: D, remoteRecipes: D?.recipes?.length || 0, remotePantry: D?.pantry?.length || 0 };
    if (D && (ch.remoteRecipes || ch.remotePantry || D.lists?.some(l => l.items.length))) { S.connectChoice = ch; drawSyncSection(); }
    else await finishConnect(ch, "merge");
  } catch (e) { msg.textContent = "Nem sikerült: " + e.message; }
}
async function finishConnect(ch, mode) {
  // a minta adatok a közös adatbázisba sosem kerülnek fel – az első beállító eszközről sem
  if (mode === "merge") await removeSamples();
  if (mode === "remote" && ch.data) {
    await applyData(mergeData({ v: 3, recipes: [], recipeDel: {}, pantry: [], pantryDel: {}, lists: [], listDel: {}, cats: { list: [], updated: 0 }, known: [] }, ch.data));
  }
  Object.assign(S.sync, { url: ch.url, key: ch.key, rev: mode === "remote" ? null : null, dirty: true, status: "ok", error: "" });
  S.connectChoice = null; await save.sync();
  await Sync.run(true);
  render();
}
async function removeSamples() {
  const demo = S.recipes.filter(r => r.tags.includes("minta")).map(r => r.id);
  await save.delRecipes(demo);
  S.recipes = S.recipes.filter(r => !demo.includes(r.id));
  S.lists.forEach(l => l.items.filter(s => s.from === "minta").forEach(s => removeItem(l, s)));
  S.lists.filter(l => l.status === "closed" && !l.items.length).forEach(l => { S.listDel[l.id] = now(); });
  S.lists = S.lists.filter(l => l.status === "draft" || l.items.length);
  await save.lists();
  // a minta kamratételek közül csak a változatlanokat (azonos mennyiség és egység)
  SAMPLE_PANTRY.forEach(([n, q, u]) => { const p = S.pantry.get(norm(n)); if (p && p.qty === q && p.unit === u) pantryRemove(norm(n)); });
  await save.pantry();
}
async function importExtras(data) {
  if (Array.isArray(data.categories)) { S.cats = uniq([...S.cats, ...data.categories]); await save.cats(); }
  if (data.cats?.list) { S.cats = uniq([...S.cats, ...data.cats.list]); await save.cats(); }
  if (data.stores?.list) { S.stores = uniq([...S.stores, ...data.stores.list]); await save.stores(); }
  if (Array.isArray(data.staples?.list)) { data.staples.list.forEach(s => { if (s && s.name && !stapleOf(s.name)) S.staples.push({ name: s.name, min: s.min ?? null, buy: s.buy ?? null, unit: s.unit || "" }); }); await save.staples(); }
  if (Array.isArray(data.pantry)) {
    for (const e of data.pantry) {
      if (typeof e === "string") { if (!S.pantry.has(norm(e))) pantrySet((data.pantryNames || {})[e] || e, null, ""); }
      else if (Array.isArray(e) && e[1]) { if (!S.pantry.has(e[0])) pantrySet(e[1].name, e[1].qty, e[1].unit); }
      else if (e && e.key) { if (!S.pantry.has(e.key)) pantrySet(e.name, e.qty, e.unit); }
    }
    await save.pantry();
  }
  if (Array.isArray(data.lists)) { const ids = new Set(S.lists.map(l => l.id)); data.lists.forEach(l => { if (l && l.id && !ids.has(l.id) && l.status === "closed") S.lists.push({ itemDel: {}, ...l }); }); await save.lists(); }
  if (Array.isArray(data.shop)) { data.shop.forEach(s => { if (s && s.name) addToShop(s.name, s.qty ?? null, s.unit || "", s.from || ""); }); await save.lists(); }
}
function unitUseCount(name) {
  const c = canonUnit(name); let n = 0;
  S.recipes.forEach(r => r.ingredients.forEach(i => { if (i.unit && canonUnit(i.unit) === c) n++; }));
  S.pantry.forEach(p => { if (p.unit && canonUnit(p.unit) === c) n++; });
  return n;
}

      if (!nv) { e.target.value = old; return; }

      const changed = [];
      S.recipes.forEach(r => { if (r.categories.some(c => norm(c) === norm(old))) { r.categories = uniq(r.categories.map(c => norm(c) === norm(old) ? (merge || nv) : c)); changed.push(r); } });
      await save.recipes(changed);
      if (merge) S.cats.splice(i, 1); else S.cats[i] = nv;
      S.catFilter = S.catFilter.map(c => norm(c) === norm(old) ? (merge || nv) : c);
      await save.cats(); drawCats(); toast(merge ? `Összevonva: ${merge}` : `Átnevezve: ${nv}`);

    $("[data-del]", row).onclick = () => { S.catConfirm = old; drawCats(); };

        await save.recipes(changed);
        S.cats.splice(i, 1); S.catFilter = S.catFilter.filter(c => norm(c) !== norm(old)); S.catConfirm = null;
        await save.cats(); drawCats(); toast(`„${old}” törölve`);

const NativeP = {};
function nativePlugin(name) {
  const Cap = window.Capacitor;
  if (!Cap?.isNativePlatform?.()) return null;
  if (!NativeP[name]) NativeP[name] = Cap.Plugins?.[name] || Cap.registerPlugin?.(name) || null;
  return NativeP[name];
}
async function saveFile(name, text, mime) {
  try {
    const FS = nativePlugin("Filesystem"), SH = nativePlugin("Share");
    if (FS && SH) {
      const res = await FS.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });
      await SH.share({ title: name, url: res.uri, dialogTitle: "Mentés helye" });
      return;
    }
  } catch (e) { if (!/cancel/i.test(String(e?.message))) toast("Mentés: " + (e?.message || e)); return; }
  try {
    const file = new File([text], name, { type: mime });
    if (navigator.canShare?.({ files: [file] }) && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e?.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
    a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Mentve: " + name + " (ha nem jelent meg, használd a Másolás gombot)");
  } catch (e) { copyText(text, "A mentés nem sikerült, ezért a vágólapra másoltam"); }
}
async function shareText(title, text) {
  try { const SH = nativePlugin("Share"); if (SH) { await SH.share({ title, text }); return; } } catch (e) { return; }
  try { if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) { await navigator.share({ title, text }); return; } } catch (e) { if (e?.name === "AbortError") return; }
  copyText(text, title + " a vágólapon");
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg); } catch (e2) { toast("Másold ki kézzel"); } ta.remove();
  }
}

/* Mértékegység-választó a [data-unitpick] mezőkhöz: koppintásra lenyíló lista (a #dl-unit elemeiből), gépeléskor szűr.
   A böngésző saját datalist-je helyett, mert iPhone-on (Safari) az nem nyílik le. */
const UnitPick = {
  pop: null, inp: null, hideT: 0, sel: -1,
  units() { return [...document.querySelectorAll("#dl-unit option")].map(o => o.value).filter(Boolean); },
  matches() {
    const all = this.units(), q = norm(this.inp.value);
    if (!q || all.some(u => norm(u) === q)) return all;
    return [...all.filter(u => norm(u).startsWith(q)), ...all.filter(u => !norm(u).startsWith(q) && norm(u).includes(q))];
  },
  open(inp) {
    clearTimeout(this.hideT); this.inp = inp; this.sel = -1;
    if (!this.pop) {
      this.pop = document.createElement("div"); this.pop.className = "unitpop"; this.pop.setAttribute("role", "listbox");
      // ne vegye el a fókuszt a mezőtől (különben a billentyűzet bezárul és a lista eltűnik)
      ["mousedown", "pointerdown"].forEach(t => this.pop.addEventListener(t, e => e.preventDefault()));
      this.pop.addEventListener("click", e => { const b = e.target.closest("button"); if (b) this.pick(b.dataset.u); });
      document.body.appendChild(this.pop);
    }
    this.draw();
  },
  draw() {
    const list = this.matches();
    if (!this.inp || !list.length) { this.hide(true); return; }
    const cur = norm(this.inp.value);
    this.pop.innerHTML = list.map((u, i) => `<button type="button" role="option" data-u="${esc(u)}" class="${norm(u) === cur || i === this.sel ? "on" : ""}">${esc(u)}</button>`).join("");
    this.pop.hidden = false; this.place();
  },
  place() {
    if (!this.inp || !this.pop || this.pop.hidden) return;
    const r = this.inp.getBoundingClientRect(), vv = window.visualViewport;
    const vTop = vv ? vv.offsetTop : 0, vH = vv ? vv.height : innerHeight, vW = vv ? vv.width : innerWidth;
    const w = Math.max(r.width, 120); this.pop.style.width = w + "px";
    this.pop.style.maxHeight = "";
    let h = Math.min(this.pop.scrollHeight, 232);
    // az alsó lapfül-sáv takarná: ott a látható rész alja a sáv teteje (nyitott billentyűzetnél a sáv amúgy is lent marad)
    const nav = document.querySelector("nav.tabs")?.getBoundingClientRect();
    const bottom = Math.min(vTop + vH, nav && nav.top > r.bottom ? nav.top : Infinity);
    const below = bottom - r.bottom, up = r.top - vTop;
    const down = below >= h + 8 || below >= up;
    if ((down ? below : up) < h + 8) { h = Math.max(90, (down ? below : up) - 8); this.pop.style.maxHeight = h + "px"; }
    const top = down ? r.bottom + 4 : r.top - h - 4;
    this.pop.style.top = (top + scrollY) + "px";
    this.pop.style.left = (Math.max(8, Math.min(r.left, vW - w - 8)) + scrollX) + "px";
  },
  pick(u) {
    const inp = this.inp; if (!inp) return;
    inp.value = u; this.hide(true);
    inp.dispatchEvent(new Event("input", { bubbles: true })); inp.dispatchEvent(new Event("change", { bubbles: true }));
  },
  hide(now) {
    clearTimeout(this.hideT);
    const go = () => { if (this.pop) this.pop.hidden = true; };
    if (now) go(); else this.hideT = setTimeout(() => { go(); this.inp = null; }, 150);
  }
};
document.addEventListener("focusin", e => { if (e.target.matches?.("input[data-unitpick]")) UnitPick.open(e.target); });
document.addEventListener("focusout", e => { if (e.target === UnitPick.inp) UnitPick.hide(false); });
document.addEventListener("input", e => { if (e.target === UnitPick.inp && e.isTrusted) UnitPick.draw(); });
// ha már fókuszban van, és újra rákoppintanak (pl. választás után), nyíljon le újra
document.addEventListener("click", e => { if (e.target.matches?.("input[data-unitpick]") && (!UnitPick.pop || UnitPick.pop.hidden)) UnitPick.open(e.target); });
document.addEventListener("keydown", e => {
  if (!UnitPick.pop || UnitPick.pop.hidden || e.target !== UnitPick.inp) return;
  const n = UnitPick.pop.children.length;
  if (e.key === "Escape") { UnitPick.hide(true); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); UnitPick.sel = (UnitPick.sel + (e.key === "ArrowDown" ? 1 : n - 1) + n) % n; UnitPick.draw(); UnitPick.pop.children[UnitPick.sel]?.scrollIntoView({ block: "nearest" }); return; }
  if (e.key === "Enter" && UnitPick.sel >= 0) { e.preventDefault(); e.stopImmediatePropagation(); UnitPick.pick(UnitPick.pop.children[UnitPick.sel].dataset.u); }
}, true);
["resize", "scroll"].forEach(t => { window.addEventListener(t, () => UnitPick.place(), { passive: true }); window.visualViewport?.addEventListener(t, () => UnitPick.place()); });

/* Beállítások → Mértékegységek, kiszerelések: a listát bővíteni lehet. A használat számát (unitUseCount) mindkét alkalmazás maga adja. */
function unitsSection() {
  return `<section class="section" id="unitSection">
      <h2>Mértékegységek, kiszerelések</h2>
      <p class="hint">Az alapegységek (${BASE_UNITS.join(", ")}) mindig megvannak. Saját egységet vagy kiszerelést is felvehetsz (pl. „pohár”, „karton”), és ezután a mértékegység-mezőkben választható. Ha megadod, mennyit ér (pl. 1 bögre = 250 ml), a program át is tudja váltani.</p>
      <div class="unitadd">
        <input id="unNew" placeholder="Új egység, pl. „karton”" aria-label="Új mértékegység vagy kiszerelés neve">
        <span class="eq">1 = </span>
        <input id="unFac" inputmode="decimal" placeholder="menny." aria-label="Mennyit ér">
        <select id="unBase" aria-label="Alapegység"><option value="">– nincs –</option>${BASE_UNITS.map(b => `<option>${b}</option>`).join("")}</select>
        <button class="btn small primary" id="unAdd">+ Hozzáad</button>
      </div>
      <div class="rows" id="unitList"></div>
    </section>`;
}
function bindUnitsSection() {
  const unAdd = async () => {
    const name = $("#unNew", V).value.trim().replace(/\.$/, ""); if (!name) { $("#unNew", V).focus(); return; }
    if (/\s/.test(name) || /\d/.test(name)) { toast("Az egység egy szó legyen, szám nélkül"); return; }
    if (BASE_UNITS.includes(canonUnit(name)) || S.units.some(u => norm(u.name) === norm(name))) { toast("Ilyen egység már van"); return; }
    const factor = parseNum($("#unFac", V).value), base = $("#unBase", V).value;
    if ((factor != null) !== !!base) { toast("Az átváltáshoz add meg a számot és az alapegységet is (vagy egyiket se)"); return; }
    S.units.push(base ? { name, base, factor } : { name }); await save.units();
    $("#unNew", V).value = ""; $("#unFac", V).value = ""; $("#unBase", V).value = "";
    drawUnits(); toast(`„${name}” hozzáadva`);
  };
  $("#unAdd", V).onclick = unAdd;
  ["#unNew", "#unFac"].forEach(id => $(id, V).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); unAdd(); } }));
  drawUnits();
}
function drawUnits() {
  const box = $("#unitList", V); if (!box) return;
  box.innerHTML = S.units.map((u, i) => {
    const n = unitUseCount(u.name), conf = S.unitConfirm === u.name;
    return `<div class="unitrow" data-i="${i}">
      <b>${esc(u.name)}</b>
      <span class="eq">1 ${esc(u.name)} =</span>
      <input data-fac inputmode="decimal" value="${numStr(u.factor ?? null)}" placeholder="–" aria-label="${esc(u.name)} mennyit ér">
      <select data-base aria-label="${esc(u.name)} alapegysége"><option value="">–</option>${BASE_UNITS.map(b => `<option ${u.base === b ? "selected" : ""}>${b}</option>`).join("")}</select>
      <span class="c">${n ? n + " helyen" : ""}</span>
      <button class="iconbtn" data-del aria-label="${esc(u.name)} törlése">${ICON_X}</button>
      ${conf ? `<div class="confirm">${n ? `${n} helyen használod; ott megmarad, csak a felajánlott egységek közül kerül ki.` : "Törlöd?"} <button class="btn small danger solid" data-yes>Törlés</button><button class="btn small" data-no>Mégse</button></div>` : ""}
    </div>`;
  }).join("") || `<p class="hint" style="padding:12px">Nincs saját egység.</p>`;
  $$(".unitrow", box).forEach(row => {
    const u = S.units[+row.dataset.i];
    const upd = async () => {
      const f = parseNum($("[data-fac]", row).value), b = $("[data-base]", row).value;
      if (f != null && b) { u.factor = f; u.base = b; } else if (f == null && !b) { delete u.factor; delete u.base; } else return;
      await save.units(); toast(u.base ? `1 ${u.name} = ${fmtNum(u.factor)} ${u.base}` : `${u.name}: átváltás nélkül`);
    };
    $("[data-fac]", row).addEventListener("change", upd); $("[data-base]", row).addEventListener("change", upd);
    $("[data-del]", row).onclick = () => { S.unitConfirm = u.name; drawUnits(); };
    const y = $("[data-yes]", row);
    if (y) { y.onclick = async () => { S.units = S.units.filter(x => x !== u); S.unitConfirm = null; await save.units(); drawUnits(); toast(`„${u.name}” törölve`); }; $("[data-no]", row).onclick = () => { S.unitConfirm = null; drawUnits(); }; }
  });
}
function drawStaples() {
  const box = $("#stapleList", V); if (!box) return;
  const list = [...S.staples].sort((a, b) => collator.compare(a.name, b.name));
  box.innerHTML = list.length ? `<div class="staplehead"><span></span><span>minimum</span><span>vegyél</span><span>egység</span><span></span></div>` + list.map(s => {
    const h = stapleHave(s), sent = inBevasarlo(s.name), conf = S.stapleConfirm === norm(s.name);
    return `<div class="staplerow" data-k="${esc(norm(s.name))}">
      <span class="nm"><b>${esc(s.name)}</b><small class="${h.low && !sent ? "low" : ""}">${sent ? "a Bevásárlóban" : esc(h.text)}</small></span>
      <input data-min inputmode="decimal" value="${numStr(s.min ?? null)}" placeholder="–" aria-label="${esc(s.name)}: minimum">
      <input data-buy inputmode="decimal" value="${numStr(s.buy ?? null)}" placeholder="–" aria-label="${esc(s.name)}: ennyit vegyél">
      <input data-unit data-unitpick autocomplete="off" value="${esc(s.unit || "")}" placeholder="–" aria-label="${esc(s.name)}: mértékegység">
      <button class="iconbtn" data-del aria-label="${esc(s.name)} törlése az alapvetők közül">${ICON_X}</button>
      ${conf ? `<div class="confirm">Leveszed az alapvetők közül? (A kamrából nem törlődik.) <button class="btn small danger solid" data-yes>Levétel</button><button class="btn small" data-no>Mégse</button></div>` : ""}
    </div>`;
  }).join("") : `<p class="hint" style="padding:12px">Még nincs alapvető élelmiszer. Vedd fel, amiből mindig legyen otthon (pl. tej, kenyér, tojás, liszt).</p>`;
  $$(".staplerow", box).forEach(row => {
    const s = S.staples.find(x => norm(x.name) === row.dataset.k); if (!s) return;
    const upd = async () => { s.min = parseNum($("[data-min]", row).value); s.buy = parseNum($("[data-buy]", row).value); s.unit = $("[data-unit]", row).value.trim(); await save.staples(); toast("Mentve");
      const h = stapleHave(s), sm = $(".nm small", row); if (!inBevasarlo(s.name)) { sm.textContent = h.text; sm.classList.toggle("low", h.low); } };
    $$("input", row).forEach(i => i.addEventListener("change", upd));
    $("[data-del]", row).onclick = () => { S.stapleConfirm = row.dataset.k; drawStaples(); };
    const y = $("[data-yes]", row);
    if (y) { y.onclick = async () => { S.staples = S.staples.filter(x => x !== s); S.stapleConfirm = null; await save.staples(); drawStaples(); toast(`„${s.name}” levéve az alapvetők közül`); }; $("[data-no]", row).onclick = () => { S.stapleConfirm = null; drawStaples(); }; }
  });
}
